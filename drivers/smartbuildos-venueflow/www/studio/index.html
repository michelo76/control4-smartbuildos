<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VenueFlow Installer Studio</title>
<style>
/* VenueFlow design system. Midnight navy, teal accent, large touch targets.
   One file shared by the operator page and Installer Studio.
   Engine floor: Gecko 96 (Control4 T3 on OS 3.1.3+, T4 on OS 3.2.1+) and current
   mobile web views. No external fonts, images or scripts (the relay's CSP forbids them). */
:root {
  --bg: #070d18; --bg-2: #0b1424; --panel: #0f1a2c; --panel-2: #14223a; --panel-3: #1a2b47;
  --line: #1f3050; --line-2: #2a3f63;
  --ink: #eaf1fb; --ink-2: #b6c5dc; --muted: #7f93b2;
  --teal: #19d3c5; --teal-2: #0fb5a9; --teal-ink: #04201e; --teal-soft: rgba(25, 211, 197, .14); --teal-line: rgba(25, 211, 197, .55);
  --ok: #34d399; --ok-soft: rgba(52, 211, 153, .14);
  --warn: #f5a524; --warn-soft: rgba(245, 165, 36, .14); --warn-line: rgba(245, 165, 36, .55);
  --bad: #f87171; --bad-soft: rgba(248, 113, 113, .14);
  --info: #60a5fa; --info-soft: rgba(96, 165, 250, .14);
  --radius: 14px; --radius-sm: 10px; --gap: 12px;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 8px 24px rgba(0, 0, 0, .28);
  --touch: 48px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; overflow: hidden;
  background-image: radial-gradient(1200px 600px at 20% -10%, rgba(25, 211, 197, .06), transparent 60%), radial-gradient(900px 500px at 110% 10%, rgba(96, 165, 250, .05), transparent 60%);
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 16px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.grow { flex: 1 1 auto; min-width: 0; } .nowrap { white-space: nowrap; } .hidden { display: none !important; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { display: flex; align-items: center; gap: var(--gap); } .row.wrap { flex-wrap: wrap; } .row.top { align-items: flex-start; }
.row.between { justify-content: space-between; } .row.end { justify-content: flex-end; } .row.tight { gap: 6px; }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; } .col.tight { gap: 6px; }
.grid { display: grid; gap: var(--gap); }
.scroll { overflow: auto; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; } .scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
.scroll { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* icons: <svg class="ic"> from VF.icon() */
svg.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.lg { width: 28px; height: 28px; } svg.ic.xl { width: 44px; height: 44px; stroke-width: 1.6; } svg.ic.sm { width: 16px; height: 16px; }

/* panels */
.panel { background: linear-gradient(180deg, var(--panel), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel > .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.panel > .panel-body { padding: 0 16px 16px; }
.panel.pad { padding: 16px; }
.panel.flat { box-shadow: none; background: var(--panel); }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; min-width: 0; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* buttons */
.btn {
  min-height: var(--touch); padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-3);
  color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-weight: 600; white-space: nowrap; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { border-color: #3b5685; } .btn:active { transform: scale(.98); }
.btn:focus-visible, .field:focus-visible, .seg button:focus-visible, .tile:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.primary { background: linear-gradient(180deg, #21e0d1, var(--teal-2)); color: var(--teal-ink); border-color: transparent; font-weight: 700; box-shadow: 0 6px 20px rgba(25, 211, 197, .25); }
.btn.outline { background: transparent; border-color: var(--teal-line); color: var(--teal); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn-line); color: #ffd58a; }
.btn.danger { background: var(--bad-soft); border-color: rgba(248, 113, 113, .5); color: #ffc2c2; }
.btn.on, .btn[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal-line); color: var(--teal); }
.btn.sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; }
.btn.lg { min-height: 58px; padding: 0 24px; font-size: 17px; border-radius: 14px; }
.btn.icon { padding: 0; width: var(--touch); } .btn.icon.sm { width: 36px; }
.btn.block { width: 100%; }
.btn:disabled, .btn[disabled] { opacity: .42; cursor: default; box-shadow: none; transform: none; }

/* segmented control / tabs */
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { min-height: 40px; padding: 0 14px; border: 1px solid transparent; background: transparent; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.seg button.on, .seg button[aria-selected="true"] { background: var(--teal-soft); border-color: var(--teal-line); color: var(--teal); }

/* chips / status */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.chip .dot, .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; display: inline-block; }
.chip.ok { color: var(--ok); border-color: rgba(52, 211, 153, .4); background: var(--ok-soft); } .chip.ok .dot, .dot.ok { background: var(--ok); }
.chip.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); } .chip.warn .dot, .dot.warn { background: var(--warn); }
.chip.bad { color: var(--bad); border-color: rgba(248, 113, 113, .5); background: var(--bad-soft); } .chip.bad .dot, .dot.bad { background: var(--bad); }
.chip.teal { color: var(--teal); border-color: var(--teal-line); background: var(--teal-soft); } .chip.teal .dot, .dot.teal { background: var(--teal); }
.chip.info { color: var(--info); border-color: rgba(96, 165, 250, .45); background: var(--info-soft); }
.dot.pulse { animation: vf-pulse 1.1s ease-in-out infinite; }
@keyframes vf-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes vf-spin { to { transform: rotate(360deg); } }
.spin { animation: vf-spin .9s linear infinite; }
@media (prefers-reduced-motion: reduce) { .dot.pulse, .spin { animation: none; } .btn { transition: none; } }

/* fields */
.field { min-height: 42px; width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink); }
select.field { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
textarea.field { min-height: 80px; resize: vertical; }
.field::placeholder { color: #5d7090; }
.field:disabled { opacity: .5; }
label.lbl { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2); font-weight: 550; min-width: 0; }
label.lbl > .hint, .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 14px; align-items: start; }
.check { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; cursor: pointer; color: var(--ink-2); }
.check input { width: 20px; height: 20px; accent-color: var(--teal); margin: 0; flex: none; }

/* toggle */
.toggle { position: relative; width: 50px; height: 28px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-3); cursor: pointer; flex: none; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #c9d6ea; transition: transform .14s; }
.toggle.on, .toggle[aria-checked="true"] { background: var(--teal); border-color: transparent; }
.toggle.on::after, .toggle[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }

/* slider */
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; cursor: pointer; }
input[type=range].slider::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--teal) var(--fill, 50%), var(--panel-3) var(--fill, 50%)); }
input[type=range].slider::-moz-range-track { height: 8px; border-radius: 99px; background: var(--panel-3); }
input[type=range].slider::-moz-range-progress { height: 8px; border-radius: 99px; background: var(--teal); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #e9fbf9; border: 3px solid var(--teal); margin-top: -8px; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
input[type=range].slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #e9fbf9; border: 3px solid var(--teal); }
input[type=range].slider:disabled { opacity: .45; }

/* tables */
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl tr.sel td { background: var(--teal-soft); }
table.tbl tr.clickable { cursor: pointer; } table.tbl tr.clickable:hover td { background: var(--panel-2); }

/* list rows */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); min-height: 52px; min-width: 0; }
.item.clickable { cursor: pointer; } .item.clickable:hover { border-color: var(--line-2); }
.item.sel { border-color: var(--teal-line); background: var(--teal-soft); }
.item.warn { border-color: var(--warn-line); background: var(--warn-soft); }

/* banners */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); }
.banner.warn { border-color: var(--warn-line); background: var(--warn-soft); color: #ffe2ad; }
.banner.bad { border-color: rgba(248, 113, 113, .5); background: var(--bad-soft); color: #ffd0d0; }
.banner.info { border-color: rgba(96, 165, 250, .45); background: var(--info-soft); color: #cfe3ff; }
.banner.ok { border-color: rgba(52, 211, 153, .4); background: var(--ok-soft); color: #c6f6e3; }
.simbar { background: repeating-linear-gradient(135deg, rgba(245, 165, 36, .2) 0 12px, rgba(245, 165, 36, .1) 12px 24px); color: #ffd58a; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-align: center; padding: 3px 8px; text-transform: uppercase; }

/* modal + toast */
.vf-backdrop { position: fixed; inset: 0; background: rgba(3, 7, 14, .72); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.vf-modal { width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.vf-modal.wide { width: min(860px, 100%); }
.vf-modal > header { padding: 18px 20px 6px; display: flex; align-items: center; gap: 10px; }
.vf-modal > .body { padding: 8px 20px 16px; overflow: auto; }
.vf-modal > footer { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.vf-toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(560px, calc(100vw - 24px)); }
.vf-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #16263f; border: 1px solid var(--line-2); box-shadow: 0 12px 30px rgba(0, 0, 0, .5); max-width: 100%; font-weight: 550; }
.vf-toast.ok { border-color: rgba(52, 211, 153, .5); } .vf-toast.warn { border-color: var(--warn-line); } .vf-toast.bad { border-color: rgba(248, 113, 113, .6); }

/* PIN pad */
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pinpad .btn { min-height: 62px; font-size: 22px; }
.pindots { display: flex; gap: 12px; justify-content: center; margin: 6px 0 14px; min-height: 18px; }
.pindots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); } .pindots i.on { background: var(--teal); border-color: var(--teal); }

/* state marks shared by tiles everywhere */
.st-confirmed { color: var(--ok); } .st-pending { color: var(--teal); } .st-commanded { color: var(--info); } .st-unknown { color: var(--muted); } .st-failed { color: var(--warn); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius); }
.kbd { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink-2); }
/* Installer Studio shell layout. Section-specific styles live in css/<section>.css. */
#login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.login-card { width: min(440px, 100%); }
.brand { display: inline-flex; align-items: center; gap: 9px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.brand b { color: var(--teal); font-weight: 700; }
.brandmark { color: var(--teal); display: inline-flex; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 248px 1fr; grid-template-areas: "sim sim" "top top" "nav main"; }
#sim { grid-area: sim; }
#top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(7, 13, 24, .85); min-width: 0; }
#top .sep { width: 1px; height: 26px; background: var(--line-2); flex: none; }
#venue { font-weight: 650; font-size: 16px; min-width: 0; display: flex; }
#save, #mode, #issues { display: flex; align-items: center; gap: 8px; flex: none; }
#nav { grid-area: nav; border-right: 1px solid var(--line); padding: 10px 10px 24px; overflow: auto; background: rgba(11, 20, 36, .6); }
#nav h4 { margin: 16px 8px 6px; }
.navitem { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 11px; padding: 0 12px; border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; text-align: left; font-weight: 550; }
.navitem:hover { background: var(--panel-2); color: var(--ink); }
.navitem.on { background: var(--teal-soft); border-color: var(--teal-line); color: var(--teal); }
.navitem .chip { padding: 1px 8px; font-size: 11.5px; }
#main { grid-area: main; overflow: auto; padding: 22px 24px 60px; min-width: 0; }
.sec { max-width: 1280px; margin: 0 auto; }
.sec.wide { max-width: none; }
#navtoggle { display: none; }
#offline { position: fixed; top: 0; left: 0; right: 0; z-index: 900; }
.split { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.stat { display: flex; align-items: center; gap: 14px; }
.stat .n { font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
@media (max-width: 1000px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "sim" "top" "main"; }
  #nav { position: fixed; top: 0; bottom: 0; left: 0; width: 270px; z-index: 800; transform: translateX(-100%); transition: transform .16s; background: var(--bg-2); box-shadow: 20px 0 60px rgba(0, 0, 0, .5); }
  #app.navopen #nav { transform: none; }
  #navtoggle { display: inline-flex; }
  #main { padding: 16px 14px 60px; }
  .split { grid-template-columns: 1fr; }
  #top .hide-sm { display: none; }
}
.wizbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 auto 14px; max-width: 1280px; border-color: var(--teal-line); flex-wrap: wrap; }
@media (max-width: 1180px) { #top { gap: 8px; padding: 8px 10px; } #top #openop { display: none; } #top .brand { font-size: 18px; } }
@media (max-width: 1060px) { #top #mode { display: none; } }
#top > * { flex-shrink: 0; } #top > #venue { flex-shrink: 1; }
/* Installer Studio: Overview, Setup Wizard, Diagnostics, Licensing, Configuration Backup,
   Publish and Rollback (sec-setup.js). Every selector here starts with "su-". */

/* shared pieces */
.su-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.su-kv { display: grid; grid-template-columns: minmax(104px, 32%) minmax(0, 1fr); gap: 8px 14px; margin: 0; align-items: baseline; }
.su-kv dt { color: var(--muted); font-size: 13px; }
.su-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.su-ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.su-big { font-size: 21px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.su-issue { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
.su-issue > svg { margin-top: 2px; }
.su-issue > .grow { flex: 1 1 220px; }
.su-issue.bad { border-color: rgba(248, 113, 113, .5); background: var(--bad-soft); color: #ffd0d0; }
.su-issue.warn { border-color: var(--warn-line); background: var(--warn-soft); color: #ffe2ad; }
.su-issue .path { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.su-issue .check { color: inherit; font-size: 13.5px; min-height: 44px; }

/* overview */
.su-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 10px; }
.su-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px 14px; min-height: 96px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.su-tile:hover { border-color: var(--line-2); }
.su-tile:focus-visible, .su-step:focus-visible, .su-type:focus-visible, .su-swatch:focus-visible, .su-swatchbtn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.su-tile svg { color: var(--teal); }
.su-tile .n { font-size: 28px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
.su-tile .l { font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.su-tile .s { font-size: 12px; color: var(--muted); }
.su-tile.warn { border-color: var(--warn-line); }
.su-tile.warn .s { color: var(--warn); }

/* wizard */
.su-wiz { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 16px; align-items: start; }
.su-stepper { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; }
.su-step { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); text-align: left; cursor: pointer; touch-action: manipulation; }
.su-step:hover { border-color: var(--line-2); }
.su-step:disabled { opacity: .45; cursor: default; }
.su-step .num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
.su-step .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.25; }
.su-step .s { display: block; font-size: 12px; color: var(--muted); }

/* Layout Designer (studio/sec-layout.js). Every selector is prefixed .ld- */
.sec.ld-host { height: calc(100vh - 150px); min-height: 440px; }
.ld { height: 100%; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

/* top bar */

.ld-left { border-right: 1px solid var(--line); grid-column: 1; }
.ld-right { border-left: 1px solid var(--line); grid-column: 3; }

  };

<script>
/* Installer Studio shell: sign-in, navigation, the draft model with autosave,
   and the helpers every section uses. Sections register themselves with
   Studio.register({...}) from their own files (sec-*.js).

   The DRAFT lives in the driver. This page holds a working copy, sends the whole

  /* ── section registry ────────────────────────────────────────────────── */
  /* def = { id, title, icon, group: 'Setup'|'Venue'|'Automation'|'Access'|'System', order,

  S.register = function (def) { sections.push(def); };

  /* ── draft model ─────────────────────────────────────────────────────── */

  S.hasDraft = function () { return config !== null; };
  S.revision = function () { return revision; };
  S.issues = function () { return issues; };
  S.summary = function () { return summary; };

  };
  S.list = function (field) { return config ? VF.asList(config[field]) : []; };
  S.find = function (field, id) { return VF.byId(S.list(field), id); };
  S.nameOf = function (field, id, fallback) { var x = S.find(field, id); return x ? x.name : (fallback !== undefined ? fallback : (id ? '(missing)' : '—')); };

  /* Applies a change to the working copy and schedules a save.

    try { fn(config); } catch (e) { console.error(e); VF.toast('That change could not be applied.', 'bad'); return; }

    dirty = true; saveError = null;
    paintSave();

  };
  S.replace = function (label, next, opts) { S.update(label, function (c) { Object.keys(c).forEach(function (k) { delete c[k]; }); Object.assign(c, VF.clone(next)); }, opts); };

  };

    LISTS.forEach(function (k) { c[k] = VF.asList(c[k]); });
    c.layout = VF.asMap(c.layout); c.layout.labels = VF.asList(c.layout.labels); c.layout.sceneButtons = VF.asList(c.layout.sceneButtons);
    c.venue = VF.asMap(c.venue); c.venue.subsystems = VF.asMap(c.venue.subsystems);
    c.displays.forEach(function (d) { if (d.sources !== 'all') d.sources = VF.asList(d.sources); d.route = VF.asMap(d.route); if (!d.route.strategy) d.route.strategy = 'room'; });

    c.rules.forEach(function (r) { r.program = VF.asMap(r.program); r.program.steps = VF.asList(r.program.steps); r.trigger = VF.asMap(r.trigger); if (r.trigger.days) r.trigger.days = VF.asList(r.trigger.days); });

      else if (r.errorCode === 'VF_UNAUTHENTICATED') { saveError = 'Signed out.'; showLogin('Your session ended. Sign in again; unsaved changes on this screen are kept until you reload.'); }
      else saveError = r.message || 'Not saved.';

    });

  }

  /* ── entity helpers ──────────────────────────────────────────────────── */
  S.freshId = function (field, base) { return VF.freshId(base, field === 'labels' || field === 'sceneButtons' ? config.layout[field] : config[field]); };

  function dropFromList(list, id) { if (list === 'all' || !list) return list; return VF.asList(list).filter(function (x) { return x !== id; }); }
  function eachStep(steps, fn) { VF.asList(steps).forEach(function (st) { fn(st); if (st.type === 'if') { eachStep(st.then, fn); eachStep(st['else'], fn); } }); }
  function eachCondition(cond, fn) { if (!cond || typeof cond !== 'object') return; fn(cond); VF.asList(cond.items).forEach(function (c) { eachCondition(c, fn); }); if (cond.item) eachCondition(cond.item, fn); }
  function eachProgram(c, fn) { c.scenes.forEach(function (s) { fn(s, 'scene'); }); c.rules.forEach(function (r) { fn(r, 'rule'); }); }
  S.eachStep = eachStep; S.eachCondition = eachCondition;

  /* Where an entity is used, as readable lines. kind: floor|area|source|display|zone|group|lighting|shade|scene|variable|profile|room */
  S.references = function (kind, id) {
    var out = [], c = config;
    function add(text) { if (out.indexOf(text) < 0) out.push(text); }
    if (kind === 'floor') { c.areas.forEach(function (a) { if (a.floorId === id) add('Area ' + a.name); }); c.displays.forEach(function (d) { if (d.floorId === id) add('Display ' + d.name); }); }
    if (kind === 'area') { c.displays.forEach(function (d) { if (d.areaId === id) add('Display ' + d.name); }); c.audioZones.forEach(function (z) { if (z.areaId === id) add('Audio zone ' + z.name); }); c.rooms.forEach(function (r) { if (r.areaId === id) add('Room panel ' + r.name); }); }
    var tail = [];
    if (kind === 'source') {
      var defaults = c.displays.filter(function (d) { return d.defaultSourceId === id; });
      if (defaults.length === 1) tail.push('Default source of ' + defaults[0].name);
      else if (defaults.length > 1) tail.push('Default source of ' + defaults.length + ' displays');
      var limited = c.displays.filter(function (d) { return d.sources !== 'all' && VF.asList(d.sources).indexOf(id) >= 0; }).length;

    if (kind === 'zone') { c.displays.forEach(function (d) { if (d.audioZoneId === id) add('Display ' + d.name); }); c.rooms.forEach(function (r) { if (r.volumeZoneId === id) add('Room panel ' + r.name); }); }
    if (kind === 'display') { c.groups.forEach(function (g) { if (g.displayIds.indexOf(id) >= 0) add('Group ' + g.name); }); }
    if (kind === 'scene') { c.rooms.forEach(function (r) { r.buttons.forEach(function (b) { if (b.sceneId === id) add('Button on room panel ' + r.name); }); }); c.layout.sceneButtons.forEach(function (b) { if (b.sceneId === id) add('Scene button on the floor plan'); }); c.rules.forEach(function (r) { if (r.trigger.type === 'scene_activated' && r.trigger.sceneId === id) add('Trigger of rule ' + r.name); }); }

          (kind === 'display' && VF.asList(t.displayIds).indexOf(id) >= 0) || (kind === 'group' && VF.asList(t.groupIds).indexOf(id) >= 0) || (kind === 'area' && VF.asList(t.areaIds).indexOf(id) >= 0)) add(label);

      c.audioZones.forEach(function (z) { if (z.areaId === id) delete z.areaId; });
      c.lighting.forEach(function (l) { if (l.areaId === id) delete l.areaId; });
      c.shades.forEach(function (s) { if (s.areaId === id) delete s.areaId; });
      c.rooms.forEach(function (r) { if (r.areaId === id) delete r.areaId; });

    }

      c.displays.forEach(function (d) { d.sources = dropFromList(d.sources, id); if (d.defaultSourceId === id) delete d.defaultSourceId; });
      c.audioZones.forEach(function (z) { z.sources = dropFromList(z.sources, id); });
      c.profiles.forEach(function (p) { p.permissions.sources = dropFromList(p.permissions.sources, id); });
    }
    if (kind === 'display') {
      c.groups.forEach(function (g) { g.displayIds = dropFromList(g.displayIds, id); });
      c.rooms.forEach(function (r) { if (r.displayIds) r.displayIds = dropFromList(r.displayIds, id); });
    }
    if (kind === 'zone') {
      c.displays.forEach(function (d) { if (d.audioZoneId === id) delete d.audioZoneId; });
      c.rooms.forEach(function (r) { if (r.volumeZoneId === id) delete r.volumeZoneId; });
      c.profiles.forEach(function (p) { p.permissions.zones = dropFromList(p.permissions.zones, id); });
    }
    if (kind === 'lighting') c.rooms.forEach(function (r) { if (r.lightingId === id) delete r.lightingId; });
    if (kind === 'shade') c.rooms.forEach(function (r) { r.shadeIds = dropFromList(r.shadeIds, id); });
    if (kind === 'scene') {
      c.rooms.forEach(function (r) { r.buttons = r.buttons.filter(function (b) { return b.sceneId !== id; }); });
      c.layout.sceneButtons = c.layout.sceneButtons.filter(function (b) { return b.sceneId !== id; });
      c.profiles.forEach(function (p) { p.permissions.sceneIds = dropFromList(p.permissions.sceneIds, id); });
      c.rules.forEach(function (r) { if (r.trigger.type === 'scene_activated' && r.trigger.sceneId === id) { r.trigger = { type: 'manual' }; r.enabled = false; } });
    }
    if (kind === 'profile') { if (c.defaultProfileId === id) delete c.defaultProfileId; c.stations = c.stations.filter(function (st) { return st.profileId !== id; }); }
    eachProgram(c, function (owner) {
      eachStep(owner.program.steps, function (st) {
        if (kind === 'source' && st.sourceId === id) delete st.sourceId;
        if (kind === 'zone' && st.zoneId === id) delete st.zoneId;
        if (kind === 'scene' && st.type === 'run_scene' && st.sceneId === id) delete st.sceneId;
        if (kind === 'lighting' && st.lightingId === id) { delete st.lightingId; delete st.presetId; }
        if (kind === 'shade' && st.shadeId === id) delete st.shadeId;
        if (kind === 'variable' && st.variableId === id) delete st.variableId;
        if (st.target) {
          if (kind === 'display') st.target.displayIds = dropFromList(st.target.displayIds, id);
          if (kind === 'group') st.target.groupIds = dropFromList(st.target.groupIds, id);
          if (kind === 'area') st.target.areaIds = dropFromList(st.target.areaIds, id);
        }
        if (st.type === 'if') eachCondition(st.condition, function (cd) { scrubCondition(cd, kind, id); });
      });
      eachCondition(owner.condition, function (cd) { scrubCondition(cd, kind, id); });
    });
  };
  function scrubCondition(cd, kind, id) {
    if (kind === 'display' && cd.displayId === id) delete cd.displayId;
    if (kind === 'zone' && cd.zoneId === id) delete cd.zoneId;
    if (kind === 'source') { if (cd.sourceId === id) delete cd.sourceId; if (cd.field === 'source' && cd.equals === id) delete cd.equals; }
    if (kind === 'variable' && cd.variableId === id) delete cd.variableId;
    if (kind === 'area' && cd.areaId === id) delete cd.areaId;
  }

  /* Asks, listing what else changes, then removes. Deleting anything here only edits the
     VenueFlow configuration; nothing in the Control4 project is touched. Returns Promise(bool). */
  S.confirmRemove = function (kind, id, noun) {
    var item = S.find(FIELD_OF[kind], id); if (!item) return Promise.resolve(false);
    var refs = S.references(kind, id);
    var body = h('div.col',
      h('p', 'Delete ' + (noun || kind) + ' "' + item.name + '" from this configuration?'),
      refs.length ? h('div.banner.warn', icon('alert'), h('div', h('div', 'It is used in ' + refs.length + ' place' + (refs.length === 1 ? '' : 's') + '. Those references will be cleared:'), h('ul.small', { style: { margin: '6px 0 0', paddingLeft: '18px' } }, refs.slice(0, 8).map(function (r) { return h('li', r); }), refs.length > 8 ? h('li', 'and ' + (refs.length - 8) + ' more') : null))) : null,
      h('p.small.muted', 'This changes the VenueFlow draft only. No Control4 device, room or connection is deleted or changed.'));
    return VF.modal({ title: 'Delete ' + (noun || kind), icon: 'trash', body: body, actions: [{ label: 'Cancel', kind: 'ghost', value: false }, { label: 'Delete', kind: 'danger', value: true }] }).then(function (ok) {
      if (ok !== true) return false;
      S.update('Delete ' + (noun || kind), function (c) { S.removeFrom(c, kind, id); });
      return true;
    });
  };

  /* ── form helpers (return DOM) ───────────────────────────────────────── */
  S.text = function (label, value, onChange, opts) {
    opts = opts || {};
    var input = h(opts.multiline ? 'textarea.field' : 'input.field', { type: opts.type || 'text', value: value === undefined || value === null ? '' : value, placeholder: opts.placeholder, maxlength: opts.max || 80, disabled: opts.disabled, inputmode: opts.inputmode });
    input.addEventListener('change', function () { onChange(input.value.trim()); });
    return h('label.lbl', label, input, opts.hint ? h('span.hint', opts.hint) : null);
  };
  S.number = function (label, value, onChange, opts) {
    opts = opts || {};
    var input = h('input.field', { type: 'number', value: value === undefined || value === null ? '' : value, min: opts.min, max: opts.max, step: opts.step || 1, placeholder: opts.placeholder, disabled: opts.disabled });
    input.addEventListener('change', function () {
      if (input.value === '') { onChange(undefined); return; }
      var n = Number(input.value); if (isNaN(n)) return;

  };
  /* options: [{value, label}] or ['a','b']; opts.none adds an empty first option with that label */
  S.select = function (label, options, value, onChange, opts) {
    opts = opts || {};
    var sel = h('select.field', { disabled: opts.disabled });
    if (opts.none !== undefined) sel.appendChild(h('option', { value: '' }, opts.none));
    options.forEach(function (o) { var v = typeof o === 'object' ? o.value : o, l = typeof o === 'object' ? o.label : o; sel.appendChild(h('option', { value: v, selected: String(v) === String(value === undefined || value === null ? '' : value) }, l)); });
    sel.addEventListener('change', function () { onChange(sel.value === '' ? undefined : sel.value); });
    return label ? h('label.lbl', label, sel, opts.hint ? h('span.hint', opts.hint) : null) : sel;
  };
  S.entityOptions = function (field) { return S.list(field).map(function (x) { return { value: x.id, label: x.name }; }); };
  S.toggle = function (label, value, onChange, hint) {
    var btn = h('button.toggle' + (value ? '.on' : ''), { type: 'button', role: 'switch', 'aria-checked': value ? 'true' : 'false', 'aria-label': label, onclick: function () { onChange(!value); } });
    return h('div.row.between', { style: { minHeight: '44px' } }, h('div.col.tight', h('span', label), hint ? h('span.hint', hint) : null), btn);
  };
  S.check = function (label, value, onChange) {
    var input = h('input', { type: 'checkbox', checked: !!value }); input.addEventListener('change', function () { onChange(input.checked); });
    return h('label.check', input, h('span', label));
  };
  /* "all" or a list of ids, as checkboxes. value: 'all' | [ids]. allowAll adds the "All" switch. */
  S.idPicker = function (label, field, value, onChange, opts) {
    opts = opts || {};
    var items = opts.items || S.list(field);
    var all = value === 'all';
    var chosen = all ? [] : VF.asList(value);
    var box = h('div.col.tight');
    if (opts.allowAll !== false) box.appendChild(S.check(opts.allLabel || 'All (including ones added later)', all, function (on) { onChange(on ? 'all' : items.map(function (x) { return x.id; })); }));
    if (!all) {
      var grid = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: '2px 10px' } });
      items.forEach(function (x) { grid.appendChild(S.check(x.name, chosen.indexOf(x.id) >= 0, function (on) { var next = chosen.filter(function (i) { return i !== x.id; }); if (on) next.push(x.id); onChange(next); })); });
      if (!items.length) grid.appendChild(h('span.hint', 'Nothing to choose from yet.'));
      box.appendChild(grid);
    }
    return h('div.col.tight', label ? h('span.small', { style: { color: 'var(--ink-2)', fontWeight: 550 } }, label) : null, box);
  };
  S.issueList = function (list) {
    if (!list || !list.length) return null;
    return h('div.col.tight', list.map(function (i) { return h('div.banner.' + (i.severity === 'error' ? 'bad' : 'warn'), icon('alert', 'sm'), h('div.small', i.message)); }));
  };
  S.issueChip = function (kind, id) {
    var list = S.issuesFor(kind, id); if (!list.length) return null;
    var errors = list.filter(function (i) { return i.severity === 'error'; }).length;
    return h('span.chip.' + (errors ? 'bad' : 'warn'), { title: list.map(function (i) { return i.message; }).join('\n') }, icon('alert', 'sm'), String(list.length));
  };
  S.sectionHead = function (title, subtitle, actions) {
    return h('div.row.between.wrap', { style: { marginBottom: '14px' } }, h('div.col.tight', h('h1', title), subtitle ? h('p.muted', subtitle) : null), h('div.row.wrap', actions || null));
  };
  S.emptyDraft = function (container) {
    VF.mount(container, S.sectionHead('No draft yet', 'Start with the Setup Wizard: pick a business type and VenueFlow fills in sensible defaults.'),
      h('div.empty', h('p', 'This driver has no configuration yet.'), h('div', { style: { marginTop: '12px' } }, h('button.btn.primary', { type: 'button', onclick: function () { S.go('wizard'); } }, icon('zap'), 'Open the Setup Wizard'))));
  };

  /* ── navigation ──────────────────────────────────────────────────────── */
  S.go = function (id, params) {
    var def = sections.filter(function (s) { return s.id === id; })[0]; if (!def) return;
    if (current && current.dispose) { try { current.dispose(); } catch (e) { console.error(e); } }
    current = def; currentParams = params || null;
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* ignore */ }
    paintNav(); rerender(); els.main.scrollTop = 0;
  };
  S.currentSection = function () { return current ? current.id : null; };
  function rerender() {
    if (!current || !els.main) return;
    var keep = els.main.scrollTop;
    var host = h('div.sec');
    try { current.render(host, currentParams); } catch (e) { console.error(e); VF.mount(host, h('div.banner.bad', icon('alert'), h('div', 'This section failed to draw: ' + e.message))); }

    els.main.scrollTop = keep;
  }
  S.refresh = rerender;
  /* A section opened from the Setup Wizard (S.go(id, {wizard: {step, title}})) gets a bar to go back or on. */
  function wizardBar() {
    var w = currentParams && currentParams.wizard; if (!w || !current || current.id === 'wizard') return null;
    return h('div.wizbar.panel', h('span.chip.teal', icon('zap', 'sm'), 'Setup Wizard'), h('span.grow', 'Step ' + w.step + ' of 6: ' + (w.title || '')),
      h('button.btn.sm.ghost', { type: 'button', onclick: function () { S.go('wizard', { step: w.step }); } }, icon('arrow-left'), 'Back to wizard'),
      h('button.btn.sm.primary', { type: 'button', onclick: function () { S.go('wizard', { step: Math.min(6, w.step + 1) }); } }, 'Next step', icon('arrow-right')));
  }
  /* For commands that change the draft ON THE DRIVER (PROFILE_PIN_SET, TEMPLATE_APPLY, BACKUP_RESTORE,
     DRAFT_DISCARD ...): saves pending edits, runs the command with the current revision, reloads.
     Returns Promise(reply). */
  S.serverEdit = function (command, payload) {
    return S.flush().then(function (saved) {
      if (!saved && config) return { ok: false, status: 'failed', errorCode: 'VF_STALE_DRAFT', message: saveError || 'Your last changes could not be saved, so this was not done.' };
      var body = Object.assign({}, payload || {});
      if (command === 'PROFILE_PIN_SET' && revision !== null) body.baseRevision = revision;
      return VF.api(command, body, { since: false }).then(function (r) { return S.reload().then(function () { return r; }); });
    });
  };
  function refreshIssueMarks() { if (current && current.onIssues) { try { current.onIssues(); } catch (e) { console.error(e); } } }

  function paintNav() {
    if (!els.nav) return;
    VF.clear(els.nav);
    GROUPS.forEach(function (g) {
      var list = sections.filter(function (s) { return s.group === g; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (!list.length) return;
      els.nav.appendChild(h('h4', g));
      list.forEach(function (s) {
        var badge = s.badge ? s.badge() : null;
        els.nav.appendChild(h('button.navitem' + (current === s ? '.on' : ''), { type: 'button', onclick: function () { S.go(s.id); }, 'aria-current': current === s ? 'page' : null },
          icon(s.icon || 'square'), h('span.grow', s.title), badge !== null && badge !== undefined && badge !== '' ? h('span.chip' + (s.badgeKind ? '.' + s.badgeKind() : ''), String(badge)) : null));
      });
    });
  }

  function paintSave() {
    if (!els.save) return;
    var text, cls = '';
    if (!config) { text = 'No draft'; }
    else if (stale) { text = 'Draft changed elsewhere'; cls = 'bad'; }
    else if (saveError) { text = saveError; cls = 'bad'; }
    else if (saving) { text = 'Saving…'; cls = 'teal'; }
    else if (dirty) { text = 'Unsaved changes'; cls = 'warn'; }
    else { text = 'Saved · revision ' + revision; cls = 'ok'; }
    VF.mount(els.save, h('span.chip.' + (cls || 'x'), h('span.dot' + (saving ? '.pulse' : '')), text), stale ? h('button.btn.sm.warn', { type: 'button', onclick: function () { S.reload(); } }, icon('refresh'), 'Reload draft') : null);
    VF.mount(els.issues, !config ? null : h('button.btn.sm' + (summary.errors ? '.danger' : (summary.warnings ? '.warn' : '.ghost')), { type: 'button', title: 'Open Publish and Rollback', onclick: function () { S.go('publish'); } },
      icon(summary.errors || summary.warnings ? 'alert' : 'check-circle'), summary.errors ? summary.errors + ' error' + (summary.errors === 1 ? '' : 's') : (summary.warnings ? summary.warnings + ' to review' : 'No issues')));
  }

  /* ── boot ────────────────────────────────────────────────────────────── */
  S.reload = function () {
    return VF.api('STUDIO_BOOTSTRAP', {}, { since: false }).then(function (r) {
      if (!r.ok) { if (r.errorCode === 'VF_UNAUTHENTICATED' || r.errorCode === 'VF_STUDIO_DISABLED') showLogin(r.errorCode === 'VF_STUDIO_DISABLED' ? r.message : null); else VF.toast(r.message, 'bad'); return false; }
      S.boot = r.data;
      S.published = r.data.published || null;
      S.history = VF.asList(r.data.history);
      applyDraft(r.data.draft || null);
      emit('boot');
      paintChrome(); paintNav(); paintSave(); rerender();
      return true;
    });
  };

  function paintChrome() {
    var b = S.boot;
    VF.mount(els.venue, h('span.ellipsis', config && config.venue.name ? config.venue.name : 'New venue'));
    VF.mount(els.mode, b.driver.simulation ? h('span.chip.warn', h('span.dot'), 'Simulation') : h('span.chip.ok', h('span.dot'), 'Live'),
      S.published ? h('span.chip', 'Published ' + S.published.versionId) : h('span.chip.warn', 'Not published'));
    els.sim.classList.toggle('hidden', !b.driver.simulation);
  }
  S.on('config', function () { if (els.venue && config) VF.mount(els.venue, h('span.ellipsis', config.venue.name || 'New venue')); });

  function showLogin(message) {
    VF.session.clear();
    var pass = h('input.field', { type: 'password', autocomplete: 'current-password', placeholder: 'Installer Passcode' });
    var err = h('div.small', { style: { color: 'var(--bad)', minHeight: '18px' } }, message || '');
    var btn = h('button.btn.primary.block.lg', { type: 'submit' }, icon('unlock'), 'Open Installer Studio');
    var form = h('form.col', { onsubmit: function (e) {
      e.preventDefault(); btn.disabled = true;
      VF.api('STUDIO_LOGIN', { passcode: pass.value }, { since: false }).then(function (r) {

        if (!r.ok) { err.textContent = (r.errorCode === 'VF_BAD_PASSCODE' || r.errorCode === 'VF_BAD_PIN') ? 'That passcode is not right.' : (r.message || 'Sign-in failed.'); pass.value = ''; pass.focus(); return; }
        VF.session.set(r.data.session); els.login.classList.add('hidden'); els.app.classList.remove('hidden');
        S.reload().then(function () { if (!current) S.go((location.hash || '').slice(1) || (config ? 'overview' : 'wizard')); });
      });
    } }, h('label.lbl', 'Installer Passcode', pass), err, btn,
      h('p.small.muted', 'The passcode is the driver property "Installer Passcode" in Composer Pro. With no passcode set, Installer Studio stays off.'));
    VF.mount(els.login, h('div.login-card.panel.pad', h('div.row', { style: { marginBottom: '14px' } }, brand(), h('span.muted', 'Installer Studio')), form));
    els.login.classList.remove('hidden'); els.app.classList.add('hidden');
    setTimeout(function () { try { pass.focus(); } catch (e) { /* ignore */ } }, 50);
  }
  function brand() { return h('div.brand', h('span.brandmark', icon('bars')), h('span', 'Venue', h('b', 'Flow'))); }
  S.brand = brand;

  S.signOut = function () { S.flush().then(function () { VF.api('LOGOUT', {}, { since: false }).then(function () { showLogin(); }); }); };

  S.start = function () {
    VF.session.use('studio');
    els.login = document.getElementById('login'); els.app = document.getElementById('app'); els.nav = document.getElementById('nav'); els.main = document.getElementById('main');
    els.save = document.getElementById('save'); els.issues = document.getElementById('issues'); els.venue = document.getElementById('venue'); els.mode = document.getElementById('mode'); els.sim = document.getElementById('sim');
    VF.mount(document.getElementById('brand'), brand());
    document.getElementById('signout').addEventListener('click', S.signOut);
    document.getElementById('openop').addEventListener('click', function () { S.flush().then(function () { window.open((VF.transport.relay || '') + '/app?as=studio', '_blank'); }); });
    document.getElementById('navtoggle').addEventListener('click', function () { els.app.classList.toggle('navopen'); });
    els.nav.addEventListener('click', function () { els.app.classList.remove('navopen'); });
    window.addEventListener('beforeunload', function (e) { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
    VF.on('online', function (on) { document.getElementById('offline').classList.toggle('hidden', on); });
    if (!VF.session.get()) { showLogin(); return; }
    els.app.classList.remove('hidden');
    S.reload().then(function (ok) { if (ok && !current) S.go((location.hash || '').slice(1) || (config ? 'overview' : 'wizard')); });
  };

  return S;
})();

<script>
/* Installer Studio: the Setup group (Overview, Setup Wizard) and the System
   group (Diagnostics, Licensing, Configuration Backup, Publish and Rollback).

   Everything here reads the working copy through Studio.config() and changes it
   only through Studio.update / Studio.serverEdit. Wizard progress is derived
   from the draft and the driver's validation of it on every draw; nothing about
   it is stored. Selectors of this file's CSS (css/setup.css) start with "su-". */
(function () {
  'use strict';
  var h = VF.h, icon = VF.icon;

  /* ── small helpers ───────────────────────────────────────────────────── */
  function cfg() { return Studio.config(); }
  function boot() { return Studio.boot || {}; }
  function schema() { return VF.asMap(boot().schema); }
  function isSim() { return !!(boot().driver && boot().driver.simulation); }
  function has(v) { return v !== undefined && v !== null && v !== ''; }
  function count(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function when(epoch) { return epoch ? VF.fmtDateTime(epoch) + ' (' + VF.ago(epoch) + ')' : 'time not recorded'; }
  function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  function onSection(id) { return Studio.currentSection() === id; }
  function words(text) { return String(text || '').replace(/_/g, ' ').replace(/\b[a-z]/g, function (ch) { return ch.toUpperCase(); }); }
  function kb(bytes) { return bytes >= 1024 * 1024 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' kB'; }
  function scrollTop() { var m = document.getElementById('main'); if (m) m.scrollTop = 0; }
  function panel(title, ic, actions, children) {
    return h('section.panel', h('div.panel-head', ic ? icon(ic) : null, h('h2.grow', title), actions || null), h('div.panel-body.col', children));
  }
  function kv(rows) {
    var dl = h('dl.su-kv');
    rows.forEach(function (r) { if (!r) return; dl.appendChild(h('dt', r[0])); dl.appendChild(h('dd', r[1])); });
    return dl;
  }
  function banner(kind, ic, content) { return h('div.banner.' + kind, icon(ic), h('div.grow', content)); }
  /* A field built by Studio.text / Studio.number / Studio.select with an empty label: name it for screen readers. */
  function bare(node, label) {
    var field = node.matches && node.matches('input, select, textarea') ? node : node.querySelector('input, select, textarea');
    if (field) field.setAttribute('aria-label', label);
    return node;
  }

  /* A Cancel action with the literal value false does not close a VF.modal (shared/vf.js treats
     false as "keep the dialog open"), so every dialog here cancels with null. */
  var CANCEL = { label: 'Cancel', kind: 'ghost', value: null };
  /* Promise(true | false). body: text or a node. */
  function ask(title, body, okLabel, kind, ic) {
    return VF.modal({ title: title, icon: ic || (kind === 'danger' ? 'alert' : 'help'), body: body, actions: [CANCEL, { label: okLabel || 'Confirm', kind: kind || 'primary', value: true }] })
      .then(function (v) { return v === true; });
  }

  /* Studio.flush() answers at once while a save is still on its way (and answers
     "not saved" when more edits wait behind one). Before a command that reads the
     STORED draft, also check that the driver holds the revision this page holds.
     Promise(true | false). */
  function settleDraft(tries) {
    if (!cfg()) return Promise.resolve(true);
    tries = tries === undefined ? 8 : tries;
    return Studio.flush().then(function (saved) {
      return VF.api('DRAFT_VALIDATE', {}, { since: false }).then(function (r) {
        if (saved !== false && r.ok && r.data && r.data.revision === Studio.revision()) return true;
        if (tries <= 0) return false;
        return wait(300).then(function () { return settleDraft(tries - 1); });
      });
    });
  }

  /* ── does the draft differ from what is published? ───────────────────── */
  /* The driver gives no comparison, so this only says "same" when it is certain:
     the draft is based on the published version and was not saved after it, or
     this page itself just published or discarded. Everything else is "may differ". */
  var edits = 0, bootEdits = 0, known = null, savedHere = 0, bootSeen = null;
  /* Studio.reload() draws the section BEFORE it emits "boot", so a fresh load is noticed
     by the identity of the bootstrap data: on that event, and again whenever it is read. */
  function syncBoot() { if (Studio.boot !== bootSeen) { bootSeen = Studio.boot; bootEdits = edits; savedHere = 0; } }
  Studio.on('boot', syncBoot);
  Studio.on('config', function () { syncBoot(); edits++; });
  Studio.on('saved', function () { syncBoot(); savedHere = Math.floor(Date.now() / 1000); });
  /* When the draft was last saved: by this page since it loaded, else what the driver said at load. */
  function draftSavedAt() { syncBoot(); return savedHere || (boot().draft && boot().draft.savedAt) || 0; }
  function relation() {
    syncBoot();
    var p = Studio.published, d = boot().draft;
    if (!cfg() || !d) return { key: 'nodraft' };
    if (!p) return { key: 'unpublished' };
    if (edits !== bootEdits) return { key: 'edited', text: 'The draft was changed on this screen since it was loaded: it may differ from ' + p.versionId + '.' };
    /* The driver compares the two documents exactly when the Studio loads. */
    if (typeof d.matchesPublished === 'boolean' && !(known && known.versionId === p.versionId && known.revision === Studio.revision())) {
      return d.matchesPublished ? { key: 'same' } : { key: 'differs', text: 'The draft has changes that are not in ' + p.versionId + '. Publish to use them.' };
    }
    if (d.basedOn !== p.versionId) return { key: 'other', text: 'The draft ' + (d.basedOn ? 'is based on ' + d.basedOn : 'was not started from a published version') + ', and ' + p.versionId + ' is published: it may differ.' };
    if (known && known.versionId === p.versionId && known.revision === Studio.revision()) return { key: 'same' };
    if (d.savedAt && p.publishedAt && d.savedAt < p.publishedAt) return { key: 'same' };
    return { key: 'maybe', text: 'The draft was saved at or after the time ' + p.versionId + ' was published: it may differ.' };
  }
  function relationChip() {
    var r = relation(), p = Studio.published;
    if (r.key === 'nodraft') return h('span.chip', 'No draft');
    if (r.key === 'unpublished') return h('span.chip.warn', h('span.dot'), 'Not published');
    if (r.key === 'same') return h('span.chip.ok', h('span.dot'), 'Draft matches ' + p.versionId);
    if (r.key === 'differs') return h('span.chip.warn', h('span.dot'), 'Draft differs from ' + p.versionId);
    return h('span.chip.warn', h('span.dot'), 'Draft may differ from ' + p.versionId);
  }

  /* ── issues: which section fixes one ─────────────────────────────────── */
  /* The titles the other section files register under (sec-entities.js, sec-layout.js, sec-programming.js). */
  var SECTION_LABEL = { devices: 'Devices', sources: 'Sources', zones: 'Audio Zones', groups: 'Display Groups', ambient: 'Lighting and Shades', rooms: 'Room Panels', profiles: 'Staff Profiles', scenes: 'Scenes', programming: 'Visual Programming', layout: 'Layout Designer', wizard: 'Setup Wizard', publish: 'Publish' };
  /* entity.kind -> section. The driver's name checks report the kind as a label
     ("Display", "Audio zone", "Staff profile"), so the lookup is by lower-case text. */
  var KIND_SECTION = {
    display: 'devices', source: 'sources', audiozone: 'zones', 'audio zone': 'zones', zone: 'zones',
    group: 'groups', 'display group': 'groups', lighting: 'ambient', 'lighting control': 'ambient', shade: 'ambient',
    room: 'rooms', 'room panel': 'rooms', profile: 'profiles', 'staff profile': 'profiles',
    scene: 'scenes', rule: 'programming', variable: 'programming', area: 'wizard', floor: 'wizard'
  };
  /* The parameter each of those sections reads to open on one entity (ignored where it is not known). */
  var KIND_PARAM = {
    display: 'displayId', source: 'sourceId', audiozone: 'zoneId', 'audio zone': 'zoneId', zone: 'zoneId',
    group: 'groupId', 'display group': 'groupId', lighting: 'lightingId', 'lighting control': 'lightingId', shade: 'shadeId',
    room: 'roomId', 'room panel': 'roomId', profile: 'profileId', 'staff profile': 'profileId', scene: 'sceneId', rule: 'ruleId'
  };
  function kindOf(i) { return i && i.entity && i.entity.kind ? String(i.entity.kind).toLowerCase() : ''; }
  function issueTarget(i) {
    var id = KIND_SECTION[kindOf(i)], path = String(i.path || '');
    if (!id && !i.entity) {
      /* No entity: the driver means the venue as a whole. Where the path names the place, go there. */
      if (/^(venue|floors|areas)\b/.test(path)) id = 'wizard';
      else if (/^(profiles|defaultProfileId)\b/.test(path)) id = 'profiles';
      else if (/^layout\b/.test(path)) id = 'layout';
    }
    id = id || 'publish';
    var params = null, key = KIND_PARAM[kindOf(i)];
    if (id === 'wizard') params = { step: 1 };
    else if (key && i.entity && has(i.entity.id)) { params = {}; params[key] = i.entity.id; }
    return { id: id, params: params };
  }
  function isError(i) { return i.severity === 'error'; }
  function isVenueIssue(i) { var k = kindOf(i); return k === 'floor' || k === 'area' || (!i.entity && /^(venue|floors|areas)\b/.test(String(i.path || ''))); }
  function isMappingIssue(i) { var k = kindOf(i); return k === 'display' || k === 'source' || k === 'audiozone' || k === 'audio zone'; }
  function isProfileIssue(i) { var k = kindOf(i); return k === 'profile' || k === 'staff profile' || (!i.entity && /^(profiles|defaultProfileId)\b/.test(String(i.path || ''))); }
  function isLayoutIssue(i) { return i.code === 'LAYOUT_INVALID' || /^layout\b/.test(String(i.path || '')); }

  /* opts: { noLink, path, extra } */
  function issueRow(i, opts) {
    opts = opts || {};
    var t = issueTarget(i), bad = isError(i);
    var link = !opts.noLink && t.id !== 'publish';
    return h('div.su-issue.' + (bad ? 'bad' : 'warn'), icon('alert', 'sm'),
      h('div.grow', h('div', i.message), opts.path && i.path ? h('div.path', i.path) : null, opts.extra || null),
      link ? h('button.btn.sm', { type: 'button', onclick: function () { Studio.go(t.id, t.params); } }, (bad ? 'Fix in ' : 'Open ') + (SECTION_LABEL[t.id] || t.id), icon('arrow-right', 'sm')) : null);
  }
  function issueRows(list, opts, max) {
    max = max || list.length;
    var rows = list.slice(0, max).map(function (i) { return issueRow(i, opts); });
    if (list.length > max) rows.push(h('p.small.muted', 'and ' + (list.length - max) + ' more. Publish and Rollback lists every one.'));
    return h('div.col.tight', rows);
  }

  /* ── what is mapped and placed (derived from the draft) ──────────────── */
  function displayMapped(d) {
    var r = VF.asMap(d.route);
    if (r.strategy === 'room' || d.power === 'room' || d.feedback === 'room') return has(d.c4RoomId);
    if (r.strategy === 'command') return !!(r.command && has(r.command.deviceId));
    return has(d.c4DeviceId);
  }
  function mapStats(c) {
    function part(list, test) { var m = list.filter(test).length; return { total: list.length, mapped: m, unmapped: list.length - m }; }
    var s = {
      displays: part(c.displays, displayMapped),
      sources: part(c.sources, function (x) { return has(x.c4DeviceId); }),
      zones: part(c.audioZones, function (x) { return has(x.c4RoomId); })
    };
    s.total = s.displays.total + s.sources.total + s.zones.total;
    s.mapped = s.displays.mapped + s.sources.mapped + s.zones.mapped;
    s.unmapped = s.total - s.mapped;
    return s;
  }
  function placed(c, d) { var l = d.layout; return !!(l && typeof l === 'object' && typeof l.x === 'number' && typeof l.y === 'number' && VF.byId(c.floors, d.floorId)); }
  function layoutStats(c) {
    var n = 0, hidden = 0;
    c.displays.forEach(function (d) { if (placed(c, d)) { n++; if (d.layout.hidden) hidden++; } });
    return { total: c.displays.length, placed: n, hidden: hidden };
  }

  function tile(n, label, ic, sub, warn, go) {

        !list.length ? banner('ok', 'check-circle', 'The driver found nothing to fix in this draft.') : null,
        errors.length ? h('div.col.tight', h('h4', 'Errors: must be fixed before publishing'), issueRows(errors, null, 8)) : null,
        warnings.length ? h('div.col.tight', h('h4', 'Warnings: fix, or acknowledge when publishing'), issueRows(warnings, null, 8)) : null
      ]);

    var info = VF.asMap(b.info), lic = VF.asMap(b.license), drv = VF.asMap(b.driver), ctl = VF.asMap(b.controller);
    var INFO_LABEL = { relay: 'Relay', host: 'Relay host', port: 'Relay port', url: 'Relay address', address: 'Relay address' };
    var rows = [
      ['Time zone', ctl.timeZone || 'Not reported by the controller'],
      ['Local time', (ctl.localTime || 'Not reported') + ' (when this screen loaded)'],

      ['Driver version', has(drv.version) ? String(drv.version) : 'Not reported']
    ];
    var first = ['relay', 'host', 'port'];
    Object.keys(info).sort(function (a, b) { var x = first.indexOf(a), y = first.indexOf(b); return (x < 0 ? 9 : x) - (y < 0 ? 9 : y) || (a < b ? -1 : 1); }).forEach(function (k) { var v = info[k]; rows.push([INFO_LABEL[k] || words(k), typeof v === 'object' ? JSON.stringify(v) : String(v)]); });
    if (!Object.keys(info).length) rows.push(['Relay', 'Not reported']);

    VF.mount(container,
      Studio.sectionHead('Overview', c.venue.name || 'New venue', [

  /* ════════════════════════════════════════════════════════════════════════
     3. Publish and Rollback (also step 6 of the wizard)
     ════════════════════════════════════════════════════════════════════════ */
  var ACK_MAX = 256;      /* the protocol accepts at most 256 ids in one list */
  var pub = { acks: {}, note: '', busy: false, refused: null, blocking: null, noteEl: null };
  /* Issue ids hold a list position (displays[24]); pairing the id with the message keeps
     a tick from moving to another entity when something above it is deleted. */
  function ackKey(i) { return i.id + '|' + i.message; }

  function doPublish() {
    if (pub.busy) return;
    pub.busy = true; pub.refused = null; pub.blocking = null;
    Studio.refresh();
    settleDraft().then(function (saved) {
      if (!saved) { pub.busy = false; pub.refused = 'The draft on the controller is not the one on this screen (not saved yet, or changed in another window), so nothing was published. Check the save indicator at the top.'; Studio.refresh(); return; }
      /* The save may have changed the issues: send what is ticked AND still listed. */
      var acked = Studio.issues().filter(function (i) { return !isError(i) && pub.acks[ackKey(i)]; }).map(function (i) { return i.id; });
      var payload = { acknowledged: acked }, note = pub.note.trim();
      if (note) payload.note = note;
      var revision = Studio.revision();
      return VF.api('PUBLISH', payload, { since: false }).then(function (r) {
        pub.busy = false;
        if (r.ok && r.data) {
          pub.acks = {}; pub.note = '';
          known = { versionId: r.data.versionId, revision: revision };
          VF.toast('Published ' + r.data.versionId + '. The venue runs on it now.', 'ok');
          return Studio.reload();
        }
        pub.refused = (r.message || 'Not published.') + (r.detail ? ' (' + r.detail + ')' : '');
        if (r.errorCode === 'VF_VALIDATION_FAILED') { pub.blocking = VF.asList(r.data && r.data.blocking); return Studio.reload(); }
        Studio.refresh();
      });
    });
  }

  function doRollback(v) {
    var p = Studio.published;
    VF.modal({
      title: 'Roll back to ' + v.versionId + '?', icon: 'history',
      body: h('div.col',
        h('p', 'The venue switches back to version ' + v.versionId + ' (published ' + when(v.publishedAt) + (v.note ? ', "' + v.note + '"' : '') + ') at once.'),
        h('p.small.muted', 'It is published again under a new version number' + (p ? ', and ' + p.versionId + ' moves to the earlier versions' : '') + '. Every staff session ends. The draft is not changed.')),
      actions: [CANCEL, { label: 'Roll back to ' + v.versionId, kind: 'warn', icon: 'history', value: true }]
    }).then(function (ok) {
      if (ok !== true) return;
      VF.api('ROLLBACK', { versionId: v.versionId, confirm: true }, { since: false }).then(function (r) {
        if (!r.ok || !r.data) { VF.toast((r.message || 'The rollback did not happen.') + (r.detail ? ' (' + r.detail + ')' : ''), 'bad'); return; }
        VF.toast('Rolled back to ' + v.versionId + '. It is published as ' + r.data.versionId + '.', 'ok');
        Studio.reload();
      });
    });
  }

  function doDiscard() {
    var p = Studio.published;
    VF.modal({
      title: 'Discard draft changes?', icon: 'trash',
      body: h('div.col',
        h('p', p ? 'The draft is reset to what is published (' + p.versionId + '). Every change made since is lost.' : 'Nothing is published, so the whole draft is deleted and setup starts again from the wizard.'),
        h('p.small.muted', p ? 'This changes the draft only. The venue keeps running on ' + p.versionId + '.' : 'Nothing changes for the venue: it has no configuration yet.')),
      actions: [CANCEL, { label: 'Discard draft changes', kind: 'danger', value: true }]
    }).then(function (ok) {
      if (ok !== true) return;
      Studio.serverEdit('DRAFT_DISCARD', { confirm: true }).then(function (r) {
        if (!r.ok) { VF.toastReply(r); return; }
        pub.acks = {}; pub.refused = null; pub.blocking = null;
        if (Studio.published && cfg()) known = { versionId: Studio.published.versionId, revision: Studio.revision() };
        VF.toast(Studio.published ? 'The draft is what is published again.' : 'The draft was deleted.', 'ok');
        Studio.refresh();
      });
    });
  }

  function reviewPanel() {
    var list = Studio.issues();
    var errors = list.filter(isError), warnings = list.filter(function (i) { return !isError(i); });
    var lic = VF.asMap(boot().license);
    var button = h('button.btn.primary.lg', { type: 'button', onclick: doPublish }, icon('upload'), 'Publish');
    var hint = h('span.small.muted');
    var ackAll = h('button.btn.sm', { type: 'button' }, icon('check'), 'Acknowledge all warnings');
    var boxes = [];
    function gate() {
      var open = warnings.filter(function (i) { return !pub.acks[ackKey(i)]; }).length;
      var why = '';
      if (errors.length) why = 'Fix the ' + count(errors.length, 'error') + ' first.';
      else if (warnings.length > ACK_MAX) why = 'There are more warnings than one publish can acknowledge (' + ACK_MAX + '). Fix some first.';
      else if (open) why = count(open, 'warning') + ' still to tick.';
      button.disabled = pub.busy || !!why;
      VF.mount(button, icon('upload'), pub.busy ? 'Publishing' : (Studio.published ? 'Publish as a new version' : 'Publish'));
      hint.textContent = pub.busy ? 'Saving the draft, then publishing.' : (why || 'Ready. The venue switches to this configuration at once.');
      ackAll.classList.toggle('hidden', !open);
    }
    ackAll.addEventListener('click', function () {
      warnings.forEach(function (i) { pub.acks[ackKey(i)] = true; });
      boxes.forEach(function (b) { b.checked = true; });
      gate();
    });
    var warningRows = warnings.map(function (i) {
      var input = h('input', { type: 'checkbox', checked: !!pub.acks[ackKey(i)] });
      input.addEventListener('change', function () { if (input.checked) pub.acks[ackKey(i)] = true; else delete pub.acks[ackKey(i)]; gate(); });
      boxes.push(input);
      return issueRow(i, { path: true, extra: h('label.check', input, h('span', 'I have checked this')) });
    });
    var note = h('input.field', { type: 'text', maxlength: 200, value: pub.note, placeholder: 'For example: patio displays added' });

        lic.restricted ? banner('bad', 'shield', h('div', 'Features are restricted by the licence (' + (lic.label || 'no label') + '). Publishing and rollback need a SmartBuildOS licence. ',
          h('button.btn.sm', { type: 'button', onclick: function () { Studio.go('licensing'); } }, 'Open Licensing'))) : null,

        errors.length ? h('div.col.tight', h('h4', 'Errors: must be fixed'), errors.map(function (i) { return issueRow(i, { path: true }); })) : null,
        warnings.length ? h('div.col.tight', h('div.row.between.wrap', h('h4', 'Warnings: fix them, or tick each one you have checked'), ackAll), warningRows) : null,
        pub.refused ? banner('bad', 'alert', h('div', h('div', pub.refused),
          pub.blocking && pub.blocking.length ? h('ul.small.su-ul', pub.blocking.slice(0, 12).map(function (i) { return h('li', i.message || i.id); }), pub.blocking.length > 12 ? h('li', 'and ' + (pub.blocking.length - 12) + ' more') : null) : null)) : null,
        h('label.lbl', 'Note for this version (optional)', note),

  function stepDone(n) {

    if (n === 1) return has(String(c.venue.name || '').trim()) && c.floors.length > 0 && !errorsOf(isVenueIssue);
    if (n === 2) return !!(wiz.discover && wiz.discover.ok) || mapStats(c).mapped > 0;
    if (n === 3) { var m = mapStats(c); return m.total > 0 && m.unmapped === 0 && !errorsOf(isMappingIssue); }
    if (n === 4) { var l = layoutStats(c); return l.total > 0 && l.placed === l.total && !errorsOf(isLayoutIssue); }
    if (n === 5) return c.profiles.length > 0 && !errorsOf(isProfileIssue);

  /* ── step 1: venue ───────────────────────────────────────────────────── */
  function applyTemplate(venueType, name, sample, label) {
    var hasDraft = !!cfg();
    var ask = !hasDraft ? Promise.resolve(true) : VF.modal({
      title: 'Replace the whole draft?', icon: 'alert',
      body: h('div.col',
        h('p', 'Starting from ' + label + ' replaces the WHOLE draft' + (cfg().venue.name ? ' of "' + cfg().venue.name + '"' : '') + ': its floors, areas, devices, scenes, rules, room panels and staff profiles (with their PINs) are removed from the draft.'),
        banner('info', 'info', Studio.published ? 'The venue keeps running on ' + Studio.published.versionId + ' until you publish. A backup of the current draft can be made first in Configuration Backup.' : 'Nothing is published, so nothing changes for the venue.')),
      actions: [CANCEL, { label: 'Replace the draft', kind: 'danger', value: true }]
    }).then(function (v) { return v === true; });
    ask.then(function (ok) {

      Studio.serverEdit('TEMPLATE_APPLY', payload).then(function (r) {
        if (r.ok) {

        else VF.toast((r.message || 'The template was not applied.') + (r.detail ? ' (' + r.detail + ')' : ''), 'bad');
      });
    });
  }

  /* A rectangle for a new area that does not cover another area of that floor. */
  function freeSpot(c, floorId, skipId) {
    var f = VF.byId(c.floors, floorId) || {};
    var W = Number(f.width) || 1200, H = Number(f.height) || 800, g = Math.max(5, Number(f.grid) || 20);
    function snap(n) { return Math.max(g, Math.round(n / g) * g); }
    var m = snap(Math.min(40, Math.min(W, H) / 10)), gap = g;
    var w = snap(Math.min(260, Math.max(g * 3, (W - 2 * m - gap) / 2))), hh = snap(Math.min(200, Math.max(g * 3, (H - 2 * m - gap) / 2)));
    var taken = c.areas.filter(function (a) { return a.floorId === floorId && a.id !== skipId && a.layout && typeof a.layout.x === 'number' && typeof a.layout.y === 'number'; }).map(function (a) { return a.layout; });
    for (var y = m; y + hh <= H - m; y += hh + gap) {
      for (var x = m; x + w <= W - m; x += w + gap) {
        var hit = false;
        for (var i = 0; i < taken.length && !hit; i++) { var t = taken[i]; hit = x < t.x + (t.w || 0) && x + w > t.x && y < t.y + (t.h || 0) && y + hh > t.y; }

      }
    }
    var n = taken.length % 8;   /* the floor is full: step down the diagonal so it is at least visible */
    return { x: m + n * g, y: m + n * g, w: w, h: hh };
  }

  /* ── step 2: discover ────────────────────────────────────────────────── */
  var CATEGORY_ORDER = ['room', 'display', 'projector', 'video_switch', 'av_over_ip', 'source', 'audio', 'amplifier', 'light', 'lighting_scene', 'shade', 'other'];
  var CATEGORY_LABEL = { room: 'Rooms', display: 'Displays', projector: 'Projectors', video_switch: 'Video switches', av_over_ip: 'AV over IP', source: 'Sources', audio: 'Audio', amplifier: 'Amplifiers', light: 'Lights', lighting_scene: 'Lighting scenes', shade: 'Shades', other: 'Other devices' };
  var CAP_LABEL = { readable: 'Readable', power: 'Power', volume: 'Volume', mute: 'Mute', video: 'Video', audio: 'Audio', linkState: 'Link state' };
  function basisLabel(b) {
    if (b === 'adapter') return isSim() ? 'the simulated project' : 'the Control4 project';
    if (b === 'proxy') return 'its proxy type';
    if (b === 'driver file name') return 'its driver file name';

  }
  function runDiscover() {
    if (wiz.discovering) return;

    });
  }
  /* Control4 id -> what the draft already uses it for. */

    return { rooms: rooms, devices: devices };
  }
  function deviceCard(d, used) {

    if (caps.readable === false) chips.push(h('span.chip.warn', 'Not readable'));

      h('div.small.muted', 'Classified from ' + basisLabel(d.basis)),

      h('div.small', list.length ? h('span', { style: { color: 'var(--teal)' } }, 'In this draft: ' + list.slice(0, 2).join(', ') + (list.length > 2 ? ' and ' + (list.length - 2) + ' more' : '')) : h('span.muted', 'Not used in this draft')));
  }
  function stepDiscover(body, c) {
    var d = wiz.discover, data = d ? d.data : null, devices = data ? VF.asList(data.devices) : [];
    VF.append(body, [
      banner('info', 'info', h('div', h('div', 'Discovery lists the devices of the Control4 project and sorts them into categories.'),
        h('div.small', 'The category is a suggestion, taken from the proxy type or the driver file name. Any device can be mapped by hand to any role in the next step.'))),
      h('div.row.wrap',
        h('button.btn.primary', { type: 'button', disabled: wiz.discovering, onclick: runDiscover }, icon('search'), wiz.discovering ? 'Looking' : (d ? 'Discover again' : 'Discover')),
        d ? h('span.small.muted', 'Last run ' + VF.fmtTime(d.at) + ': ' + count(devices.length, 'device') + '. Kept until this page is closed.') : h('span.small.muted', 'Nothing in the Control4 project is changed by this.'))
    ]);
    if (!d) return;
    if (!d.ok) VF.append(body, banner('bad', 'alert', (d.message || 'The device list could not be read.') + (d.detail ? ' (' + d.detail + ')' : '')));
    if (!devices.length) {
      if (d.ok) VF.append(body, h('div.empty', h('p', 'The project reported no devices.'), isSim() ? h('p.small', 'In Simulation mode the simulated project is built from the published configuration: publish once and discover again.') : null));
      return;
    }
    var used = usage(c), by = {};
    devices.forEach(function (x) { (by[x.category || 'other'] = by[x.category || 'other'] || []).push(x); });

  function stamp(epoch) {
    if (!epoch) return '';
