<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>AI Core</title>
<style>
/* Dark only: a wall touchscreen and the phone app's dark rooms. */
:root {
  --bg: #0b0e14; --panel: #161a23; --panel2: #1d2230; --ink: #eef1f7; --muted: #a3acbb; --line: #2b3242;
  --accent: #8b83ff; --accent-ink: #0d0f1a; --qbub: #2d2a66; --qink: #f1f0ff;
  --ok: #4cc38a; --warn: #f0b25a; --bad: #ff8a80; --info: #7cb4ff;
  --gutter: 16px; --maxw: 980px;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; }
html { font-size: 17px; }
@media (min-width: 900px) and (min-height: 520px) { html { font-size: 20px; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
body { overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
button, input { font: inherit; color: inherit; }
button { min-height: 48px; min-width: 48px; padding: 8px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.muted { color: var(--muted); }

/* ── header ── */
header { flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
header .wrap { display: flex; align-items: center; gap: 10px; min-height: 64px; padding-top: 8px; padding-bottom: 8px; }
h1 { font-size: 1.25rem; margin: 0; white-space: nowrap; }
#statusBtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 48px; flex: 0 1 auto; border-radius: 999px; padding: 6px 14px; text-align: left; }
#statusText { white-space: nowrap; font-size: .9rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.info { background: var(--info); }
.spacer { flex: 1 1 0; min-width: 0; }
.hbtn { display: flex; align-items: center; gap: 8px; padding: 8px 14px; white-space: nowrap; }
.badge { min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--warn); color: #1a1205; font-weight: 750; font-size: .85rem; display: inline-flex; align-items: center; justify-content: center; }
#ownerBox { display: flex; align-items: center; gap: 8px; }
#ownerPill { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(139, 131, 255, .18); color: var(--ink); font-size: .9rem; white-space: nowrap; }
#lockIn { font-size: .9rem; }
@media (max-width: 640px) {
  .hlabel { display: none; }
  header.elevated #statusText { display: none; }
  h1 { font-size: 1.1rem; }
  .hbtn { padding: 8px 10px; gap: 6px; }
  #ownerPill { padding: 4px 9px; }
  header .wrap { gap: 6px; }
  #statusBtn { padding: 6px 10px; }
}
#statusPanel { border-top: 1px solid var(--line); }
#statusPanel ul { list-style: none; margin: 0; padding: 10px 0; }
#statusPanel li { padding: 4px 0; overflow-wrap: anywhere; }
#notice { flex: none; background: rgba(240, 178, 90, .14); border-bottom: 1px solid rgba(240, 178, 90, .4); }
#notice .wrap { padding-top: 10px; padding-bottom: 10px; overflow-wrap: anywhere; }

/* ── the thread ── */
main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#thread { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; padding-bottom: 18px; }
.center { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px var(--gutter); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 26px; width: 100%; max-width: 560px; text-align: center; }
.card h2 { margin: 6px 0 8px; font-size: 1.35rem; }
.card p { margin: 8px 0 18px; overflow-wrap: anywhere; }
.card .big { width: 56px; height: 56px; color: var(--accent); }
.card button { width: 100%; min-height: 56px; font-size: 1.05rem; }
.msg { max-width: min(82%, 760px); padding: 12px 18px; border-radius: 22px; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.q { align-self: flex-end; background: var(--qbub); color: var(--qink); border-bottom-right-radius: 6px; }
.msg.a { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; font-size: 1.05rem; }
.msg.a.problem { border-color: rgba(240, 178, 90, .6); }
.msg.a .note-t { color: var(--warn); }
@media (max-width: 640px) { .msg { max-width: 92%; } }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; text-align: center; }
.divider::before, .divider::after { content: ""; flex: 1 1 0; height: 1px; background: var(--line); }
.divider span { max-width: 80%; overflow-wrap: anywhere; }
.sys { align-self: center; max-width: 92%; text-align: center; color: var(--warn); background: rgba(240, 178, 90, .1); border-radius: 14px; padding: 8px 14px; overflow-wrap: anywhere; }
.thinking { display: flex; align-items: center; gap: 12px; white-space: normal; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.still { display: block; margin-top: 6px; color: var(--muted); font-size: .92rem; }

/* rich answers: cards inside the answer bubble (text nodes only) */
.cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; white-space: normal; }
.b-stat { flex: 1 1 120px; min-width: 0; background: var(--panel2); border-radius: 16px; padding: 12px 14px; border-top: 4px solid var(--line); }
.b-stat .l { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.b-stat .v { font-size: 2rem; font-weight: 750; line-height: 1.15; overflow-wrap: anywhere; }
.b-stat .u { font-size: 1rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
.b-list { flex: 1 1 100%; min-width: 0; background: var(--panel2); border-radius: 16px; padding: 8px 14px; }
.b-list .t { font-weight: 650; padding: 6px 0; overflow-wrap: anywhere; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.b-list .t + .row { border-top: 1px solid var(--line); }
.row .rl { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.row .rv { flex: 0 1 auto; max-width: 55%; text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.b-note { flex: 1 1 100%; min-width: 0; border-left: 4px solid var(--info); background: rgba(124, 180, 255, .1); border-radius: 10px; padding: 10px 14px; overflow-wrap: anywhere; }
.tone-ok { border-color: var(--ok) !important; } .tone-warn { border-color: var(--warn) !important; } .tone-bad { border-color: var(--bad) !important; } .tone-info { border-color: var(--info) !important; }
.b-note.tone-ok { background: rgba(76, 195, 138, .1); } .b-note.tone-warn { background: rgba(240, 178, 90, .12); } .b-note.tone-bad { background: rgba(255, 138, 128, .12); }
.row .dot.tone-ok { background: var(--ok); } .row .dot.tone-warn { background: var(--warn); } .row .dot.tone-bad { background: var(--bad); } .row .dot.tone-info { background: var(--info); }
.v.tone-ok { color: var(--ok); } .v.tone-warn { color: var(--warn); } .v.tone-bad { color: var(--bad); } .v.tone-info { color: var(--info); }

/* action cards: confirm once while owner-unlocked */
.b-action { flex: 1 1 100%; min-width: 0; margin-top: 12px; background: var(--panel2); border: 1px solid rgba(139, 131, 255, .45); border-radius: 16px; padding: 12px 14px; white-space: normal; }
.b-action.gone { border-color: var(--line); }
.b-action .at { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.b-action .ad { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.b-action .ast { margin-top: 8px; font-size: .95rem; color: var(--muted); overflow-wrap: anywhere; }
.b-action .ast.tone-ok { color: var(--ok); font-weight: 700; } .b-action .ast.tone-bad { color: var(--bad); } .b-action .ast.tone-warn { color: var(--warn); } .b-action .ast.tone-info { color: var(--info); }
.b-action .an { margin-top: 4px; font-size: .9rem; color: var(--warn); }
.aact { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.aact button { flex: 1 1 140px; min-height: 52px; font-size: 1.05rem; }
/* chips: questions to tap */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 48px; max-width: 100%; padding: 10px 16px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); text-align: left; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
.chip.follow { border-color: rgba(139, 131, 255, .55); color: #d9d6ff; }
.chips.after { align-self: flex-start; max-width: 92%; }
.empty { display: flex; flex-direction: column; gap: 14px; padding: 6vh 0 12px; }
.empty h2 { margin: 0; font-size: 1.5rem; }
.empty p { margin: 0; }
.empty .chips { flex-direction: column; align-items: stretch; }
.empty .chip { border-radius: 16px; }
@media (min-width: 900px) { .empty .chips { flex-direction: row; } .empty .chip { flex: 1 1 260px; } }

/* ── the input bar ── */
#composer { flex: none; border-top: 1px solid var(--line); background: var(--panel); }
#composer .wrap { padding-top: 10px; padding-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
#strip { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; scrollbar-width: none; }
#strip::-webkit-scrollbar { display: none; }
/* a strip that scrolls sideways fades at its edge, so a chip that runs on is seen to continue */
#strip { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); padding-right: 40px; }
#strip .chip { flex: none; max-width: 22rem; min-height: 44px; padding: 8px 14px; font-size: .92rem; }
.bar { display: flex; align-items: center; gap: 10px; }
.field { flex: 1 1 auto; min-width: 0; position: relative; display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; }
#question { flex: 1 1 auto; min-width: 0; min-height: 56px; padding: 10px 16px; border: 0; background: transparent; font-size: 1.05rem; outline: none; }
.field:focus-within { border-color: var(--accent); }
#counter { flex: none; padding-right: 14px; font-size: .85rem; color: var(--muted); }
#counter.near { color: var(--warn); font-weight: 650; }
#kbBtn { min-width: 56px; min-height: 56px; padding: 0; display: flex; align-items: center; justify-content: center; }
#kbBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
#send { min-height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 22px; }
@media (max-width: 640px) { #send .hlabel { display: none; } #send { padding: 0 14px; } }

/* ── the in-page keyboard: in the flow, never over the thread ── */
#kb { flex: none; background: #10131b; border-top: 1px solid var(--line); padding: 8px 6px 10px; }
#kb .rows { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; }
#kb .krow { display: flex; gap: 6px; justify-content: center; }
#kb button { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 0 2px; margin: 0; border-radius: 10px; background: #2a3040; border-color: #343b4e; font-size: 1.3rem; }
#kb button.wide { flex: 1.6 1 0; font-size: 1rem; }
#kb button.space { flex: 5 1 0; font-size: 1rem; }
#kb button.go { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
#kb button.on { background: #e9ecf5; color: #10131b; }
#kb button.spacer-key { visibility: hidden; flex: .5 1 0; }
@media (max-height: 640px) { #kb button { min-height: 48px; } #kb .rows { gap: 5px; } }

/* ── sheets: approvals, the PIN pad ── */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; }
.sheet h2 { font-size: 1.2rem; margin: 0 0 10px; }
.sheet p { overflow-wrap: anywhere; }
.sheet .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.sheet .actions button { flex: 1 1 140px; }
.risk { font-weight: 700; color: var(--warn); }
#pad { z-index: 20; }
#pad .sheet { max-width: 380px; }
#padDots { font-size: 2rem; letter-spacing: .4em; text-align: center; min-height: 2.6rem; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.keys button { min-height: 68px; font-size: 1.5rem; margin: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wrap">
      <h1>AI Core</h1>
      <button id="statusBtn" class="ghost" type="button" aria-expanded="false" aria-controls="statusPanel"><span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span></button>
      <div class="spacer"></div>
      <div id="ownerBox" class="hidden">
        <span id="ownerPill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg><span class="hlabel">Owner · Locks in</span><span id="lockIn"></span></span>
      </div>
      <button id="elevate" class="hbtn hidden" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="hlabel">Unlock for more</span></button>
      <button id="lock" class="hbtn hidden" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="hlabel">Lock</span></button>
      <button id="apprBtn" class="hbtn" type="button" aria-label="Approvals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span class="hlabel">Approvals</span><span id="apprBadge" class="badge hidden"></span></button>
    </div>
    <div id="statusPanel" class="hidden">
      <div class="wrap">
        <ul id="status" aria-live="polite"></ul>
        <p class="muted">Works only on the home network.</p>
      </div>
    </div>
  </header>

  <div id="notice" class="hidden" role="status"><div class="wrap" id="noticeText"></div></div>

  <main id="scroller">
    <div id="gate" class="center">
      <div class="card">
        <svg id="gateLock" class="big hidden" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <svg id="gateInfo" class="big" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        <h2 id="gateTitle">AI Core</h2>
        <p id="chatMsg" class="muted">Connecting to AI Core…</p>
        <div id="chatLocked" class="hidden">
          <button id="unlock" class="primary" type="button">Unlock with owner PIN</button>
        </div>
      </div>
    </div>
    <div id="chatOpen" class="hidden">
      <div class="wrap" id="thread" aria-live="polite"></div>
    </div>
  </main>

  <div id="composer" class="hidden">
    <div class="wrap">
      <div id="strip" role="group" aria-label="Suggested questions"></div>
      <div class="bar">
        <button id="kbBtn" type="button" aria-pressed="false" aria-label="On-screen keyboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
        <label class="field" for="question"><input id="question" type="text" maxlength="500" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Ask AI Core…" aria-label="Your question"><span id="counter" class="hidden" aria-live="polite"></span></label>
        <button id="ask" class="primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg><span class="hlabel">Send</span></button>
      </div>
    </div>
  </div>
  <div id="kb" class="hidden" role="group" aria-label="On-screen keyboard"><div class="rows" id="kbRows"></div></div>
</div>

<div id="apprSheet" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="hAppr">
  <div class="sheet">
    <h2 id="hAppr">Approvals</h2>
    <p id="apprCount"></p>
    <p id="apprMsg" class="muted"></p>
    <div id="item" class="hidden">
      <p id="itemTitle"></p>
      <p id="itemDesc" class="muted"></p>
      <p id="itemRisk" class="risk"></p>
      <p id="itemLeft" class="muted"></p>
      <div class="actions">
        <button id="approve" class="primary" type="button">Approve</button>
        <button id="decline" type="button">Decline</button>
        <button id="closeItem" type="button">Close item</button>
      </div>
    </div>
    <div class="actions">
      <button id="review" class="primary hidden" type="button">Review next item</button>
      <button id="apprClose" type="button">Done</button>
    </div>
  </div>
</div>

<div id="pad" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="padTitle">
  <div class="sheet">
    <h2 id="padTitle"></h2>
    <p class="muted">Owner PINs only. The PIN goes to PIN Lock, not to AI Core.</p>
    <div id="padDots" aria-live="polite"></div>
    <div class="keys" id="keys"></div>
    <div class="actions">
      <button id="padCancel" type="button">Cancel</button>
      <button id="padGo" class="primary" type="button">Enter</button>
    </div>
  </div>
</div>

<script id="aicore-pure">
// Pure helpers: no DOM globals, no network. Tested under node
// (test/test_aicore_page.lua). Every piece of text from the controller or
// the cloud is set with textContent; nothing is ever parsed as HTML.
var AIC = (function () {
  var A = {};
  A.PINLOCK_PORT = 47831;
  A.MAX_PIN = 8;
  A.MAX_Q = 500;
  A.COUNTER_FROM = 400; // the counter shows from here
  A.STILL_WORKING = 45; // seconds: one calm line that it is still working
  A.parseQuery = function (search) {
    var out = {};
    String(search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) { return; }
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { out[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { /* ignored */ }
    });
    return out;
  };
  // The PIN may go to one place only: PIN Lock's /verify on THIS host.
  A.validVerifyUrl = function (url, pageHost) {
    var m = /^http:\/\/([A-Za-z0-9.\-]+):(\d+)\/verify$/.exec(String(url || ''));
    return !!m && m[1] === pageHost && Number(m[2]) === A.PINLOCK_PORT;
  };
  A.verifyBody = function (challengeId, pin) {
    return JSON.stringify({ challenge_id: String(challengeId), pin: String(pin) });
  };
  A.padAdd = function (cur, digit) {
    cur = String(cur || '');
    if (!/^[0-9]$/.test(String(digit)) || cur.length >= A.MAX_PIN) { return cur; }
    return cur + digit;
  };
  A.padBack = function (cur) { return String(cur || '').slice(0, -1); };
  A.dots = function (cur) { return new Array(String(cur || '').length + 1).join('•'); };
  A.lockText = function (seconds) {
    var s = Math.max(0, Math.floor(Number(seconds) || 0));
    return s <= 60 ? 'PIN entry is locked for ' + s + ' s' : 'PIN entry is locked for ' + Math.ceil(s / 60) + ' min';
  };
  // fixed: the 30 minutes after the PIN end the unlock, whatever the use.
  A.leftText = function (seconds, fixed) {
    var s = Math.max(0, Math.floor(Number(seconds) || 0));
    if (s < 60) { return 'Locks again in ' + s + ' s'; }
    return fixed ? 'Locks again in ' + Math.ceil(s / 60) + ' min (30 minutes after the PIN)' : 'Locks again after ' + Math.ceil(s / 60) + ' min without use';
  };
  A.shortLeft = function (seconds) {
    var s = Math.max(0, Math.floor(Number(seconds) || 0));
    return s >= 60 ? 'Locks in ' + Math.ceil(s / 60) + ' min' : 'Locks in ' + s + ' s';
  };
  A.minutesLeft = function (seconds) {
    var s = Math.max(0, Math.floor(Number(seconds) || 0));
    return s >= 60 ? Math.ceil(s / 60) + ' min' : s + ' s';
  };

    call(path, body).then(function (j) {
      if (j && j.reason === 'session' && !retried) {
        return openSession().then(function () { act(path, body, true, onRefused); });
      }
      if (j && j.error === 'bad token') { offline('address'); return; }
      if (j && j.ok === false) {
        if (onRefused) { onRefused(j); } else { notice(j.message || 'That did not work. Try again, or use the SmartBuildOS portal.'); }
      }
      poll();
    }).catch(failed);
  }
  // A person pressed something: clear the last line first, so an outcome
  // that repeats it is still seen to arrive.
  function press(path, body) { notice(''); act(path, body); }
  // A question: its refusal (too many questions, too long, offline…) is a
  // sentence in the thread, and typed text comes back to the input.
  // ── chat action cards: one tap while owner-unlocked ──
  var tapped = {};
  var countdowns = [];
  var countdownsAt = 0;
  function actionNow(ref, what) {
    notice('');
    if (what === 'pin') { act('/approvals/next', { ref: ref }); apprOpen = true; return; }
    act('/chat/action', { ref: ref, decision: what }, false, function (j) {
      notice(j.message || 'That did not work. Try again, or use the SmartBuildOS portal.');
    });
  }
  // The countdowns tick between polls (the controller's expiry still rules).
  if (typeof setInterval === 'function') setInterval(function () {
    var gone = (Date.now() - countdownsAt) / 1000;
    var redraw = false;
    countdowns.forEach(function (c) {
      var left = Math.max(0, (Number(c.expires_in) || 0) - gone);
      c.line.textContent = AIC.countdown(left);
      if (left <= 0) { c.buttons.forEach(function (b) { b.disabled = true; }); }
      // The platform's one-tap window ran out: Confirm becomes Use PIN now,
      // not at the next poll.
      if (c.tap_in !== undefined && c.tap_in !== null && !c.action.needs_pin && c.tap_in - gone <= 0) {
        c.action.needs_pin = true;
        c.action.tap_in = null;
        redraw = true;
      }
    });
    if (redraw && last && last.chat) { sig = ''; drawThread(last.chat); }
  }, 1000);
  function askNow(body) {
    notice('');
    sysNote = '';
    drawSys();
    act('/ask', body, false, function (j) {
      sysNote = j.message || 'That question could not be sent. Try again in a moment.';
      if (body.question && !$('question').value) { setText(body.question); }
      drawSys();
    });
  }

  // ── rendering ──
  function render(st) {
    last = st;
    if (!st || !st.ok) {
      if (st && st.message) { notice(st.message); }
      return;
    }
    AIC.renderLines(document, $('status'), AIC.statusLines(st));
    var hs = AIC.headerStatus(st);
    $('statusText').textContent = hs.text;
    $('statusDot').className = 'dot ' + hs.tone;
    var chat = st.chat || {};
    var mode = AIC.chatMode(st);
    var progress = AIC.pinProgress(st);
    // the gate: off / locked
    show('gate', mode === 'off' || mode === 'locked');
    $('gateTitle').textContent = mode === 'locked' ? 'Owner PIN needed' : 'Chat unavailable';
    $('chatMsg').textContent = progress || chat.message || '';
    show('chatLocked', mode === 'locked');
    show('gateLock', mode === 'locked');
    show('gateInfo', mode !== 'locked');
    $('unlock').disabled = !!progress;
    // the chat: open / elevated
    var on = mode === 'open' || mode === 'elevated';
    show('chatOpen', on);
    show('composer', on);
    if (!on) { setKb(false); }
    show('ownerBox', mode === 'elevated');
    document.querySelector('header').classList.toggle('elevated', mode === 'elevated');
    show('lock', mode === 'elevated');
    show('elevate', mode === 'open' && !!chat.can_elevate);
    $('elevate').disabled = !!progress;
    $('lockIn').textContent = mode === 'elevated' ? AIC.minutesLeft(chat.locks_in) : '';
    // whichever comes first: 5 minutes without use, or 30 minutes after the PIN (locks_fixed)
    $('lock').setAttribute('title', mode === 'elevated' ? AIC.leftText(chat.locks_in, chat.locks_fixed) : '');
    $('ownerPill').setAttribute('title', mode === 'elevated' ? AIC.leftText(chat.locks_in, chat.locks_fixed) : '');
    $('ownerBox').classList.toggle('fixed', mode === 'elevated' && !!chat.locks_fixed);
    if (on) {
      drawThread(chat);
    } else {
      sig = '';
      thinking = {};
      AIC.clear($('thread'));
      AIC.clear($('strip'));
      setText('');
    }
    // approvals
    var ap = st.approvals || {};
    $('apprCount').textContent = ap.text || '';
    $('apprMsg').textContent = ap.message || '';
    $('apprBadge').textContent = ap.count > 0 ? String(ap.count) : '';
    show('apprBadge', ap.count > 0);
    var rv = st.review;
    if (rv) { apprOpen = true; }
    show('apprSheet', apprOpen && !padFor);
    show('item', !!rv);
    show('review', !!ap.can_review && !rv);
    if (rv) {
      $('itemTitle').textContent = rv.loading ? 'Loading…' : (rv.title || '');
      $('itemDesc').textContent = rv.description || '';
      $('itemRisk').textContent = AIC.riskText(rv.risk);
      $('itemLeft').textContent = rv.loading ? '' : ('Decide within ' + rv.grant_left + ' s');
      $('approve').disabled = !!rv.loading;
      $('decline').disabled = !!rv.loading;
    }
    if (st.notice) { notice(st.notice); }
    var p = st.prompt;
    if (p && !p.waiting && p.challenge_id && AIC.validVerifyUrl(p.verify_url, location.hostname)) {
      if (padFor !== p.challenge_id) { openPad(p); }
    } else if (!p && padFor) {
      closePad();
    }
  }
  function nearBottom() {
    var m = $('scroller');
    return !m.scrollHeight || m.scrollHeight - m.scrollTop - m.clientHeight < 120;
  }
  function toBottom() { var m = $('scroller'); m.scrollTop = m.scrollHeight || 0; }
  function drawThread(chat) {
    var s = AIC.signature(chat) + '|' + JSON.stringify(AIC.questionChips(chat).map(function (c) { return c.label; }));
    if (s !== sig) {
      var stick = nearBottom() || sig === '';
      sig = s;
      var list = chat.conversation || [];
      var root = $('thread');
      if (!list.length) {
        AIC.clear(root);
        thinking = {};
        root.appendChild(emptyState(chat));
      } else {
        countdowns = [];
        thinking = AIC.renderConversation(document, root, chat, askNow, { onAction: actionNow, tapped: tapped, countdowns: countdowns });
        countdownsAt = Date.now();
      }
      drawSys();
      AIC.renderChips(document, $('strip'), list.length ? AIC.questionChips(chat) : [], askNow);
      show('strip', !!list.length && !kbOpen);
      if (stick) { toBottom(); }
    }
    var grew = false;
    (chat.conversation || []).forEach(function (e) {
      var t = thinking[e.id];
      if (t) {
        t.text.textContent = AIC.thinkingText(e.age);
        var was = !t.still.classList.contains('hidden');
        t.still.classList.toggle('hidden', !AIC.stillWorking(e.age));
        grew = grew || (!was && AIC.stillWorking(e.age));
      }
    });
    if (grew && nearBottom()) { toBottom(); }
  }
  function emptyState(chat) {
    var box = AIC.el(document, 'div', 'empty');
    box.appendChild(AIC.el(document, 'h2', '', chat.elevated ? 'Owner unlocked. Ask anything about the house.' : 'Ask AI Core about your home'));
    box.appendChild(AIC.el(document, 'p', 'muted', chat.followups
      ? 'Ask follow-up questions: AI Core remembers this conversation until it starts over.'
      : 'Each question is answered on its own.'));
    var chips = AIC.questionChips(chat);
    if (chips.length) {
      box.appendChild(AIC.el(document, 'p', 'muted', 'Try asking…'));
      var c = AIC.el(document, 'div', 'chips');
      AIC.renderChips(document, c, chips, askNow);
      box.appendChild(c);
    }
    return box;
  }
  // A refusal of the last question, as a sentence at the end of the thread.
  function drawSys() {
    var root = $('thread');
    var old = sysEl;
    if (old && old.parentNode) { old.parentNode.removeChild(old); }
    sysEl = null;
    if (sysNote) { sysEl = AIC.el(document, 'div', 'sys', sysNote); root.appendChild(sysEl); toBottom(); }
  }
  var sysEl = null;

  // ── the input ──
  function setText(v) {
    v = String(v || '');
    $('question').value = v;
    kb.value = v;
    var n = Array.from(v).length;
    $('counter').textContent = AIC.counterText(n);
    $('counter').classList.toggle('near', n >= AIC.MAX_Q - 20);
    show('counter', !!AIC.counterText(n));
    $('ask').disabled = !v.trim();
  }
  function send() {
    var q = $('question').value;
    if (!q.trim()) { return; }
    setText('');
    kb.shift = true;
    drawKb();
    askNow({ question: q });
  }
  // ── the in-page keyboard: opened by the button, never over the thread ──
  function setKb(open) {
    kbOpen = !!open;
    var input = $('question');
    input.readOnly = kbOpen; // no system keyboard while ours is open
    if (kbOpen) { input.setAttribute('inputmode', 'none'); if (input.blur) { input.blur(); } }
    else { input.removeAttribute('inputmode'); }
    $('kbBtn').setAttribute('aria-pressed', kbOpen ? 'true' : 'false');
    show('kb', kbOpen);
    show('strip', !kbOpen && !!(last && last.chat && (last.chat.conversation || []).length));
    if (kbOpen) { drawKb(); toBottom(); }
  }
  var kbKeys = [];
  function drawKb() {
    var rows = $('kbRows');
    AIC.clear(rows);
    kbKeys = [];
    AIC.KB[kb.layer].forEach(function (row, ri) {
      var r = AIC.el(document, 'div', 'krow');
      if (ri === 1 && kb.layer === 'abc') { r.appendChild(AIC.el(document, 'span', 'spacer-key')); }
      row.forEach(function (key) {
        var cls = key === 'space' ? 'space' : (key === 'shift' || key === 'back' || key === 'layer' || key === 'send') ? 'wide' : '';
        if (key === 'send') { cls += ' go'; }
        if (key === 'shift' && kb.shift) { cls += ' on'; }
        var b = AIC.el(document, 'button', cls, AIC.kbLabel(key, kb));
        b.setAttribute('type', 'button');
        b.setAttribute('data-key', key);
        if (key === 'back') { b.setAttribute('aria-label', 'Delete'); }
        if (key === 'shift') { b.setAttribute('aria-label', 'Shift'); }
        b.addEventListener('pointerdown', function (e) { if (e && e.preventDefault) { e.preventDefault(); } });
        b.addEventListener('click', function () { kbKey(key); });
        r.appendChild(b);
        kbKeys.push(b);
      });
      if (ri === 1 && kb.layer === 'abc') { r.appendChild(AIC.el(document, 'span', 'spacer-key')); }
      rows.appendChild(r);
    });
  }
  function kbKey(key) {
    kb.value = $('question').value;
    var before = kb.layer + kb.shift;
    var n = AIC.kbPress(kb, key);
    kb.shift = n.shift; kb.layer = n.layer;
    setText(n.value);
    if (n.send) { send(); return; }
    if (kb.layer + kb.shift !== before) { drawKb(); }
  }
  $('kbBtn').addEventListener('click', function () { setKb(!kbOpen); });
  $('question').addEventListener('input', function () { setText($('question').value); });
  $('question').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !padFor) { e.preventDefault(); send(); } });
  $('ask').addEventListener('click', send);

  // ── the PIN pad: the PIN goes to PIN Lock's verify_url and nowhere else ──
  function drawDots() { $('padDots').textContent = AIC.dots(pin); }
  function openPad(p) {
    padFor = p.challenge_id;
    pin = '';
    drawDots();
    setKb(false);
    $('padTitle').textContent = p['for'] === 'chat' ? 'Owner PIN to unlock the chat' : 'Owner PIN to review one item';
    show('apprSheet', false);
    show('pad', true);
    $('padGo').focus();
  }
  function closePad() { pin = ''; padFor = null; drawDots(); show('pad', false); show('apprSheet', apprOpen); }
  function submitPin() {
    var p = last && last.prompt;
    if (!p || p.challenge_id !== padFor || !AIC.validVerifyUrl(p.verify_url, location.hostname) || !pin) { return; }
    var body = AIC.verifyBody(p.challenge_id, pin);
    var cid = p.challenge_id;
    pin = '';
    closePad();
    fetch(p.verify_url, { method: 'POST', cache: 'no-store', credentials: 'omit', headers: { 'Content-Type': 'text/plain' }, body: body })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.locked) { notice(AIC.lockText(j.retry_in)); } })
      .catch(function () { notice('This screen could not reach PIN Lock. Use the SmartBuildOS portal.'); })
      .then(function () { act('/pin/done', { challenge_id: cid }); });
    body = null;
  }
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].forEach(function (k) {
    var b = AIC.el(document, 'button', '', k);
    b.setAttribute('type', 'button');
    if (!k) { b.disabled = true; b.setAttribute('aria-hidden', 'true'); }
    if (k === '⌫') { b.setAttribute('aria-label', 'Delete'); }
    b.addEventListener('click', function () { pin = k === '⌫' ? AIC.padBack(pin) : AIC.padAdd(pin, k); drawDots(); });
    $('keys').appendChild(b);
  });
  document.addEventListener('keydown', function (e) {
    if (!padFor) { return; }
    if (/^[0-9]$/.test(e.key)) { pin = AIC.padAdd(pin, e.key); drawDots(); e.preventDefault(); }
    else if (e.key === 'Backspace') { pin = AIC.padBack(pin); drawDots(); e.preventDefault(); }
    else if (e.key === 'Enter') { submitPin(); e.preventDefault(); }
    else if (e.key === 'Escape') { closePad(); act('/pin/cancel'); }
  });
  $('padGo').addEventListener('click', submitPin);
  $('padCancel').addEventListener('click', function () { closePad(); act('/pin/cancel'); });

  // ── actions ──
  $('unlock').addEventListener('click', function () { press('/chat/unlock'); });
  $('elevate').addEventListener('click', function () { press('/chat/unlock'); });
  $('lock').addEventListener('click', function () { press('/chat/lock'); });
  $('statusBtn').addEventListener('click', function () {
    var open = $('statusPanel').classList.contains('hidden');
    show('statusPanel', open);
    $('statusBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  $('apprBtn').addEventListener('click', function () { apprOpen = true; show('apprSheet', true); act('/approvals/refresh'); });
  $('apprClose').addEventListener('click', function () {
    apprOpen = false; show('apprSheet', false);
    if (last && last.review) { press('/approvals/close'); }
  });
  $('review').addEventListener('click', function () { press('/approvals/next'); });
  $('approve').addEventListener('click', function () { press('/approvals/decide', { decision: 'approve' }); });
  $('decline').addEventListener('click', function () { press('/approvals/decide', { decision: 'decline' }); });
  $('closeItem').addEventListener('click', function () { press('/approvals/close'); });
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      var now = Date.now();
      if (last && last.chat && last.chat.elevated && now - touchedAt > 30000) {
        touchedAt = now;
        call('/chat/touch').catch(function () {});
      }
    }, true);
  });
  // Hidden: the owner unlock ends and (open chat) the conversation starts over.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { closePad(); setKb(false); if (S) { call('/chat/lock', { hidden: true }).catch(function () {}); } }
    else if (S) { poll(); }
  });
  window.addEventListener('pagehide', function () { if (S) { call('/session/close', {}, true).catch(function () {}); } });

  setText('');
  if (!K || location.protocol !== 'http:') { offline('copy'); return; }
  if (typeof fetch !== 'function') { offline('nofetch'); return; }
  openSession().then(poll).catch(failed);
})();
</script>
</body>
</html>
