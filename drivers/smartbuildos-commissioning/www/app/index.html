<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commissioning Matrix</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mute:#5f6b7a; --line:#dfe3e8; --ok:#17803d; --bad:#b42318; --warn:#9a6700; --acc:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f26; --ink:#eef1f4; --mute:#97a3b1; --line:#2b333d; --ok:#4cc27a; --bad:#ff7b72; --warn:#e3b341; --acc:#6aa5ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; padding:0 16px calc(24px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; background:var(--bg); padding:12px 0 8px; z-index:2; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; }
  .counts { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:13px; background:var(--card); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:15px; }
  .chip.on { border-color:var(--acc); color:var(--acc); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:12px 0; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .name { font-weight:600; }
  .kind { color:var(--mute); font-size:13px; }
  .badge { font-size:12px; border-radius:6px; padding:2px 8px; border:1px solid var(--line); white-space:nowrap; }
  .passed { color:var(--ok); border-color:var(--ok); } .failed { color:var(--bad); border-color:var(--bad); }
  .awaiting, .armed, .testing { color:var(--acc); border-color:var(--acc); } .skipped { color:var(--warn); border-color:var(--warn); }
  button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:12px 14px; min-height:44px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.ok { color:var(--ok); border-color:var(--ok); } button.bad { color:var(--bad); border-color:var(--bad); }
  button:disabled { opacity:.5; }
  .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; } .btns button { flex:1 1 0; }
  input[type=text] { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); margin-top:8px; }
  .read { font-size:14px; margin-top:8px; padding:8px; border-radius:8px; background:var(--bg); }
  .mismatch { color:var(--bad); } .match { color:var(--ok); } .unreported { color:var(--warn); }
  .note { color:var(--mute); font-size:13px; margin-top:6px; }
  .err { color:var(--bad); margin:12px 0; }
  .small { font-size:13px; color:var(--mute); }
  a, .link { color:var(--acc); background:none; border:0; padding:8px 0; min-height:0; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>Commissioning Matrix</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="counts" id="counts"></div>
</header>
<div id="err" class="err" hidden></div>
<main id="main"></main>
<script>
(function () {
  var K = new URLSearchParams(location.search).get('k') || '';
  var S = null, room = null, busy = false, drafts = {}, nameDraft = '';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(path, body) {
    var opt = body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) };
    return fetch(path + '?k=' + encodeURIComponent(K), opt).then(function (r) { return r.json(); });
  }
  function fail(msg) { var e = $('err'); e.hidden = !msg; e.textContent = msg || ''; }
  function act(path, body) {
    busy = true;
    return api(path, body).then(function (r) { if (!r.ok) fail(r.reason || 'Not accepted'); else fail(''); return load(); })
      .catch(function () { fail('Lost contact with the controller'); }).then(function () { busy = false; });
  }
  var KIND = { light: 'Light', shade: 'Shade', av: 'AV zone', sensor: 'Sensor' };
  var STATUS = { pending: 'Not tested', testing: 'Testing…', awaiting: 'Your verdict', armed: 'Waiting for sensor', passed: 'Passed', failed: 'Failed', skipped: 'Skipped' };
  function readback(it) {
    if (!it.reported && !it.detail) return '';
    var rb = it.readback || {};
    var lines = [];
    if (rb.act && rb.act.level != null) lines.push('Device reports ' + esc(rb.act.level) + '% after acting');
    if (rb.act && rb.act.source != null) lines.push('Room reports source ' + esc(rb.act.source));
    if (rb.restore && rb.restore.level != null) lines.push('Back at ' + esc(rb.restore.level) + '%');
    return '<div class="read"><span class="' + esc(it.reported) + '">' + esc(it.reported || '') + '</span> ' + esc(it.detail || '') +
      (lines.length ? '<br>' + lines.join('<br>') : '') +
      '<div class="small">This is what the device reports. Your tap says whether it really happened.</div></div>';
  }
  function card(it) {
    var h = '<div class="card" data-k="' + esc(it.key) + '"><div class="row"><div><div class="name">' + esc(it.name) +
      '</div><div class="kind">' + esc(KIND[it.kind] || it.kind) + '</div></div><span class="badge ' + esc(it.status) + '">' + esc(STATUS[it.status] || it.status) + '</span></div>';
    if (it.status === 'pending') {
      h += '<div class="btns"><button class="primary" data-a="test">Test</button><button data-a="skip">Skip</button></div>';
    } else if (it.status === 'testing') {
      h += '<div class="read">' + esc(it.prompt || '') + '</div><div class="btns"><button class="bad" data-a="fail">Fail</button></div>';
    } else if (it.status === 'armed') {
      h += '<div class="read">' + esc(it.prompt || '') + '</div><div class="btns"><button class="bad" data-a="fail">Fail</button><button data-a="skip">Skip</button></div>';
    } else if (it.status === 'awaiting') {
      h += '<div class="read">' + esc(it.prompt || '') + '</div>' + readback(it) +
        '<input type="text" placeholder="Note (optional)" value="' + esc(drafts[it.key] || '') + '" data-note>' +
        '<div class="btns"><button class="ok" data-a="pass">Pass</button><button class="bad" data-a="fail">Fail</button><button data-a="skip">Skip</button></div>' +
        '<div class="btns"><button data-a="test">Test again</button></div>';
    } else {
      h += readback(it) + (it.note ? '<div class="note">Note: ' + esc(it.note) + '</div>' : '') +
        '<div class="btns"><button data-a="test">Test again</button></div>';
    }
    return h + '</div>';
  }
  function render() {
    if (!S) return;
    var c = S.counts;
    $('sub').textContent = (S.read_only ? 'Read-only: ' + S.licence : (S.run_id ? 'Run ' + S.status.replace('_', ' ') : 'No run in progress'));
    $('counts').innerHTML = ['passed', 'failed', 'skipped'].map(function (k) { return '<span class="pill ' + (k === 'passed' ? 'passed' : k === 'failed' ? 'failed' : 'skipped') + '">' + c[k] + ' ' + k + '</span>'; }).join('') + '<span class="pill">' + c.pending + ' open</span>';
    var m = $('main'), h = '';
    var active = S.status === 'running' || S.status === 'complete';
    if (!active) {
      h += '<div class="card"><div class="name">' + (S.status === 'signed_off' ? 'Signed off by ' + esc(S.signed_off_by) : S.status === 'aborted' ? 'Last run aborted' : 'Ready to test') + '</div>' +
        '<input type="text" id="tech" placeholder="Your name" value="' + esc(nameDraft || S.technician) + '">' +
        '<div class="btns"><button class="primary" data-g="run"' + (S.read_only || !S.rooms.length ? ' disabled' : '') + '>Start run, all rooms</button></div>' +
        '<div class="small" style="margin-top:8px">Or pick a room to test on its own:</div><div class="chips" style="flex-wrap:wrap">' +
        S.rooms.map(function (r) { return '<button class="chip" data-g="room" data-room="' + esc(r.name) + '"' + (S.read_only ? ' disabled' : '') + '>' + esc(r.name) + ' (' + r.count + ')</button>'; }).join('') + '</div></div>';
      if (!S.rooms.length) h += '<div class="card">The test list is empty. Add devices to rooms in Composer, or add items by hand in the driver properties.</div>';
      m.innerHTML = h;
      return;
    }
    var rooms = S.rooms.filter(function (r) { return S.items.some(function (i) { return i.room === r.name; }); });
    if (!room || !rooms.some(function (r) { return r.name === room; })) room = S.current_room || (rooms[0] && rooms[0].name);
    h += '<div class="chips">' + rooms.map(function (r) {
      var open = S.items.filter(function (i) { return i.room === r.name && ['passed', 'failed', 'skipped'].indexOf(i.status) < 0; }).length;
      return '<button class="chip' + (r.name === room ? ' on' : '') + '" data-g="pick" data-room="' + esc(r.name) + '">' + esc(r.name) + (open ? ' · ' + open : ' ✓') + '</button>';
    }).join('') + '</div>';
    h += S.items.filter(function (i) { return i.room === room; }).map(card).join('');
    if (S.status === 'complete') {
      h += '<div class="card"><div class="name">Every item has a verdict</div><div class="small">Signing off stores this run as the as-built record.</div>' +
        '<input type="text" id="signer" placeholder="Your name" value="' + esc(nameDraft || S.technician) + '"><div class="btns"><button class="primary" data-g="signoff"' + (S.read_only ? ' disabled' : '') + '>Sign off</button></div></div>';
    }
    h += '<div style="text-align:center"><button class="link" data-g="abort">Abort this run</button></div>';
    m.innerHTML = h;
  }
  document.addEventListener('input', function (e) {
    var card = e.target.closest && e.target.closest('.card[data-k]');
    if (e.target.hasAttribute('data-note') && card) drafts[card.getAttribute('data-k')] = e.target.value;
    if (e.target.id === 'tech' || e.target.id === 'signer') nameDraft = e.target.value;
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || busy) return;
    var g = b.getAttribute('data-g'), a = b.getAttribute('data-a'), c = b.closest('.card[data-k]');
    if (g === 'run') act('run', { technician: nameDraft || (S && S.technician) || '' });
    else if (g === 'room') act('room', { room: b.getAttribute('data-room'), technician: nameDraft || (S && S.technician) || '' }).then(function () { room = b.getAttribute('data-room'); render(); });
    else if (g === 'pick') { room = b.getAttribute('data-room'); render(); act('room', { room: room }); }
    else if (g === 'signoff') act('signoff', { name: nameDraft || (S && S.technician) || '' });
    else if (g === 'abort') { if (confirm('Abort this run? What was recorded is kept as aborted.')) act('abort', {}); }
    else if (a && c) {
      var key = c.getAttribute('data-k');
      if (a === 'test') act('test', { key: key });
      else { var note = drafts[key] || ''; delete drafts[key]; act('mark', { key: key, verdict: a, note: note }); }
    }
  });
  function load() {
    return api('state').then(function (s) { S = s; fail(''); if (!busy || true) render(); }).catch(function () { fail('Lost contact with the controller'); });
  }
  function tick() {
    var typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    var working = S && S.items && S.items.some(function (i) { return i.status === 'testing' || i.status === 'armed'; });
    (typing && !working ? Promise.resolve() : load()).then(function () { setTimeout(tick, working ? 1500 : 4000); });
  }
  tick();
})();
</script>
</body>
</html>
