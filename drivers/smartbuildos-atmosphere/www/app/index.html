<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src http: https:; img-src https://radar.weather.gov https://mapservices.weather.noaa.gov data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Atmosphere</title>
<style>
/* ============================================================
   SmartBuildOS Atmosphere — Navigator WebView
   Single-file app. Dark-first. Gecko 96 safe (no :has(), no
   container queries, no backdrop-filter reliance).
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

:root, html[data-theme="dark"] {
  --bg0: #0a0f17; --bg1: #101a29;
  --text: #eef2f7;
  --dim: rgba(238,242,247,.64);
  --faint: rgba(238,242,247,.40);
  --card: rgba(255,255,255,.055);
  --card-solid: rgba(22,30,43,.72);
  --card-brd: rgba(255,255,255,.085);
  --chip: rgba(255,255,255,.075);
  --chip-brd: rgba(255,255,255,.10);
  --accent: #8ab8ff;
  --accent-soft: rgba(138,184,255,.16);
  --nav-bg: rgba(8,11,17,.90);
  --hairline: rgba(255,255,255,.07);
  --track: rgba(255,255,255,.14);
  --input-bg: rgba(255,255,255,.06);
  --shadow: 0 8px 28px rgba(0,0,0,.35);
  --pop: #6aa9ff;
  --ok: #46c98c; --warn: #ffb224; --bad: #e5484d;
}
html[data-theme="light"] {
  --bg0: #e8eef5; --bg1: #f4f7fa;
  --text: #16202c;
  --dim: rgba(22,32,44,.66);
  --faint: rgba(22,32,44,.42);
  --card: rgba(255,255,255,.62);
  --card-solid: rgba(255,255,255,.86);
  --card-brd: rgba(20,32,48,.09);
  --chip: rgba(18,30,46,.06);
  --chip-brd: rgba(18,30,46,.10);
  --accent: #2b6cd4;
  --accent-soft: rgba(43,108,212,.12);
  --nav-bg: rgba(248,250,252,.92);
  --hairline: rgba(18,30,46,.09);
  --track: rgba(18,30,46,.16);
  --input-bg: rgba(18,30,46,.05);
  --shadow: 0 8px 24px rgba(30,45,66,.12);
  --pop: #2b6cd4;
}
html[data-theme="oled"] {
  --bg0: #000000; --bg1: #000000;
  --card: rgba(255,255,255,.065);
  --card-solid: rgba(14,14,16,.9);
  --nav-bg: rgba(0,0,0,.92);
}
html[data-theme="control4"] {
  --bg0: #191b1e; --bg1: #202327;
  --card: rgba(255,255,255,.05);
  --card-solid: rgba(32,35,39,.85);
  --accent: #aab4c0;
  --accent-soft: rgba(170,180,192,.14);
  --nav-bg: rgba(20,22,25,.94);
  --pop: #93a3b5;
}
html[data-theme="ambient"] {
  /* JS sets --bg0/--bg1/--accent per weather mode */
  --bg0: #0a0f17; --bg1: #101a29;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(180deg, var(--bg0), var(--bg1));
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select { font: inherit; color: var(--text); }
svg { display: block; }

#bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

#mockBadge {
  position: fixed; top: 10px; right: 12px; z-index: 40;
  font-size: 9px; font-weight: 600; letter-spacing: .18em;
  color: var(--faint); border: 1px solid var(--hairline);
  padding: 3px 8px; border-radius: 999px; background: var(--card);
}

#appRoot { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
#screens { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }

.screen {
  display: none;
  padding: 22px clamp(16px, 4vw, 44px) 104px;
  max-width: 1060px; margin: 0 auto;
  animation: fadeUp .32s ease;
}
.screen.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.screen-head { margin: 4px 2px 18px; }
.screen-title { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.screen-sub { font-size: 13px; color: var(--dim); margin-top: 3px; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--card-brd);
  border-radius: 18px; padding: 18px 20px;
}
.sec-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.sec-label svg { width: 13px; height: 13px; opacity: .8; }

/* ---------- banners ---------- */
.banner {
  display: flex; align-items: center; gap: 12px;
  border-radius: 16px; padding: 13px 16px; margin-bottom: 14px;
  font-size: 13.5px; line-height: 1.35; border: 1px solid transparent;
}
.banner svg { width: 18px; height: 18px; flex: none; }
.banner .b-title { font-weight: 600; }
.banner .b-sub { color: inherit; opacity: .8; font-size: 12.5px; margin-top: 1px; }
.banner-alert { cursor: pointer; color: #fff; }
.banner-sev-EMERGENCY, .banner-sev-WARNING { background: rgba(180,32,42,.82); border-color: rgba(255,120,120,.35); }
.banner-sev-WATCH { background: rgba(196,98,16,.82); border-color: rgba(255,180,90,.35); }
.banner-sev-ADVISORY { background: rgba(160,120,14,.80); border-color: rgba(255,210,110,.32); }
.banner-sev-INFORMATIONAL, .banner-sev-NORMAL { background: rgba(38,84,150,.72); border-color: rgba(140,180,255,.3); }
.banner-stale { background: rgba(120,90,20,.4); border-color: rgba(255,190,90,.25); color: var(--text); }
.banner-sim { background: var(--accent-soft); border-color: var(--chip-brd); color: var(--text); }
.banner-sim .b-title { letter-spacing: .1em; font-size: 11.5px; }

/* ---------- NOW ---------- */
.hero { text-align: center; padding: clamp(8px, 3vh, 34px) 0 8px; }
.hero-loc { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.hero-clock { font-size: 12.5px; color: var(--dim); margin-top: 3px; font-variant-numeric: tabular-nums; }
.hero-temp { font-size: clamp(84px, 15vw, 138px); font-weight: 200; line-height: 1.02; letter-spacing: -.03em; margin: 6px 0 0; }
.hero-cond { font-size: 17px; color: var(--dim); font-weight: 500; margin-top: 2px; }
.hero-meta { font-size: 14px; color: var(--dim); margin-top: 6px; display: flex; gap: 16px; justify-content: center; }
.hero-meta b { color: var(--text); font-weight: 600; }

.chip-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 22px 0 6px; }
.chip {
  display: flex; align-items: center; gap: 9px;
  background: var(--chip); border: 1px solid var(--chip-brd);
  border-radius: 999px; padding: 9px 15px; font-size: 13.5px;
}
.chip svg { width: 15px; height: 15px; opacity: .75; }
.chip b { font-weight: 600; }
.chip .u { color: var(--faint); font-size: 11px; margin-left: 1px; }

.now-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
@media (max-width: 640px) { .now-grid { grid-template-columns: 1fr; } }
.sun-track { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.sun-cell { text-align: center; }
.sun-cell .t { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sun-cell .l { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-top: 2px; }
.sun-arc { flex: 1; height: 44px; }
.kv-mini { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
.kv-mini .k { color: var(--dim); }
.kv-mini .v { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- HOURLY ---------- */
.hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; padding-bottom: 4px; }
.hour-strip { display: flex; }
.hour-cell {
  width: 62px; flex: none; text-align: center; padding: 10px 0 6px;
  border-radius: 14px;
}
.hour-cell.now-cell { background: var(--chip); }
.hour-cell .h-time { font-size: 11.5px; color: var(--dim); font-weight: 500; }
.hour-cell .h-icon { width: 24px; height: 24px; margin: 8px auto 6px; }
.hour-cell .h-icon svg { width: 24px; height: 24px; }
.hour-cell .h-temp { font-size: 15px; font-weight: 600; }
.hour-cell .h-pop { font-size: 10.5px; color: var(--pop); margin-top: 3px; min-height: 13px; font-weight: 600; }
.hour-cell .h-wind { font-size: 10px; color: var(--faint); margin-top: 2px; }
.hour-chart { display: block; margin-top: 4px; }

/* ---------- FORECAST ---------- */
.day-row { border-bottom: 1px solid var(--hairline); }
.day-row:last-child { border-bottom: none; }
.day-head {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 13px 4px; text-align: left; border-radius: 12px;
}
.day-head .d-name { width: 92px; flex: none; font-size: 14.5px; font-weight: 600; }
.day-head .d-icon { width: 26px; height: 26px; flex: none; }
.day-head .d-icon svg { width: 26px; height: 26px; }
.day-head .d-pop { width: 46px; flex: none; font-size: 11.5px; color: var(--pop); font-weight: 600; text-align: center; }
.day-head .d-short { flex: 1; font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.day-head .d-temps { flex: none; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.day-head .d-lo { color: var(--faint); font-size: 14.5px; width: 34px; text-align: right; }
.day-head .d-hi { font-weight: 600; font-size: 14.5px; width: 34px; text-align: right; }
.day-head .d-bar { width: 72px; height: 4px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; }
.day-head .d-bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, #5fa6ff, #ffb46b); }
.day-detail { display: none; padding: 2px 8px 16px 108px; font-size: 13px; line-height: 1.55; color: var(--dim); }
.day-row.open .day-detail { display: block; }
.day-detail b { color: var(--text); font-weight: 600; display: block; margin-top: 8px; margin-bottom: 2px; font-size: 12px; }
@media (max-width: 640px) {
  .day-head .d-short { display: none; }
  .day-head .d-bar { width: 44px; }
  .day-detail { padding-left: 8px; }
}

/* ---------- RADAR ---------- */
.radar-shell { border-radius: 18px; overflow: hidden; border: 1px solid var(--card-brd); background: #05080d; position: relative; }
.radar-pan { overflow: auto; max-height: 62vh; scrollbar-width: thin; }
.radar-img { display: block; width: 100%; height: auto; transform-origin: 0 0; }
.radar-img.z15 { width: 150%; }
.radar-img.z20 { width: 200%; }
.radar-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.tbtn {
  background: var(--chip); border: 1px solid var(--chip-brd); border-radius: 999px;
  padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--dim);
  display: inline-flex; align-items: center; gap: 7px;
}
.tbtn svg { width: 13px; height: 13px; }
.tbtn.on { color: var(--text); background: var(--accent-soft); border-color: var(--accent); }
.radar-note { font-size: 11.5px; color: var(--faint); margin-top: 10px; line-height: 1.5; }
.radar-stamp { font-size: 11.5px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
.radar-err {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  color: var(--dim); font-size: 13px; background: rgba(5,8,13,.85); text-align: center; padding: 20px;
}
.radar-shell.err .radar-err { display: flex; }
/* interactive radar */
.istage {
  position: relative; overflow: hidden; background: #05080d;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.istage.dragging { cursor: grabbing; }
.ilayers { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.ilayer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0; transition: opacity .35s ease; pointer-events: none;
}
.ilayer.on { opacity: 1; }
.ilayer.ibounds { filter: invert(1) opacity(.55); }
.ilayer.iframe { transition: opacity .2s ease; visibility: hidden; }
.ilayer.iframe.show { visibility: visible; }
.iload {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 12.5px; letter-spacing: .06em;
  background: rgba(5,8,13,.35); pointer-events: none;
  transition: opacity .4s ease;
}
.iload.off { opacity: 0; }
.ichip {
  position: absolute; left: 10px; bottom: 10px; z-index: 3;
  background: rgba(150,24,34,.85); color: #fff; border: 1px solid rgba(255,120,120,.4);
  border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
}
.iattr {
  position: absolute; right: 8px; bottom: 6px; z-index: 3;
  font-size: 9px; color: rgba(255,255,255,.45); letter-spacing: .04em; pointer-events: none;
}

/* ---------- ALERTS ---------- */
.alert-card { border-radius: 18px; padding: 16px 18px; border: 1px solid; color: #fff; }
.alert-extreme { background: rgba(150,24,34,.68); border-color: rgba(255,110,110,.4); }
.alert-severe { background: rgba(170,84,12,.62); border-color: rgba(255,170,90,.4); }
.alert-moderate { background: rgba(150,110,10,.55); border-color: rgba(255,205,100,.4); }
.alert-minor { background: rgba(30,74,138,.58); border-color: rgba(130,175,255,.4); }
.alert-top { display: flex; align-items: flex-start; gap: 10px; }
.alert-top svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.alert-event { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.alert-head { font-size: 13px; opacity: .92; margin-top: 5px; line-height: 1.45; }
.alert-meta { font-size: 12px; opacity: .78; margin-top: 9px; line-height: 1.5; }
.alert-body { display: none; margin-top: 12px; border-top: 1px solid rgba(255,255,255,.22); padding-top: 12px; }
.alert-card.open .alert-body { display: block; }
.alert-body h4 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin: 10px 0 4px; }
.alert-body p { font-size: 12.5px; line-height: 1.55; opacity: .95; white-space: pre-wrap; }
.alert-more { margin-top: 10px; font-size: 12px; font-weight: 600; opacity: .85; padding: 4px 0; }
.all-clear { text-align: center; padding: 60px 20px; color: var(--dim); }
.all-clear svg { width: 44px; height: 44px; margin: 0 auto 14px; color: var(--ok); }
.all-clear .t { font-size: 16px; font-weight: 600; color: var(--text); }
.all-clear .s { font-size: 13px; margin-top: 5px; }

/* ---------- DETAILS ---------- */
.det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.det-tile { background: var(--card); border: 1px solid var(--card-brd); border-radius: 16px; padding: 14px 16px; }
.det-tile .l { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.det-tile .l svg { width: 12px; height: 12px; }
.det-tile .v { font-size: 21px; font-weight: 600; margin-top: 7px; font-variant-numeric: tabular-nums; }
.det-tile .v .u { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 2px; }
.det-tile .s { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
.det-tile.wide { grid-column: 1 / -1; }
.compass { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.compass .rose { width: 44px; height: 44px; flex: none; }
.dot-ok, .dot-bad, .dot-warn { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
.dot-ok { background: var(--ok); } .dot-bad { background: var(--bad); } .dot-warn { background: var(--warn); }

/* ---------- SETTINGS ---------- */
.settings-wrap { display: flex; gap: 18px; align-items: flex-start; }
.settings-rail { flex: none; width: 168px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.rail-btn {
  text-align: left; padding: 9px 13px; border-radius: 11px; font-size: 13.5px;
  color: var(--dim); font-weight: 500; white-space: nowrap;
}
.rail-btn.active { background: var(--chip); color: var(--text); font-weight: 600; }
.settings-body { flex: 1; min-width: 0; }
@media (max-width: 760px) {
  .settings-wrap { flex-direction: column; }
  .settings-rail { width: 100%; flex-direction: row; overflow-x: auto; scrollbar-width: none; position: static; padding-bottom: 4px; }
}
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--hairline); }
.set-row:last-child { border-bottom: none; }
.set-row .sl { font-size: 14px; min-width: 0; }
.set-row .sl .sd { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.set-select, .set-text {
  background: var(--input-bg); border: 1px solid var(--chip-brd); border-radius: 10px;
  padding: 8px 10px; font-size: 13.5px; max-width: 210px; outline: none;
}
.set-select option { color: #16202c; background: #f4f7fa; }
.set-text { width: 190px; }
.toggle {
  flex: none; width: 46px; height: 27px; border-radius: 999px; background: var(--track);
  position: relative; transition: background .18s ease; border: none;
}
.toggle i { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .18s ease; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.toggle.on { background: var(--accent); }
.toggle.on i { transform: translateX(19px); }
.slider-row { display: block; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.slider-row:last-child { border-bottom: none; }
.slider-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slider-top .sl { font-size: 13.5px; }
.slider-num {
  width: 78px; background: var(--input-bg); border: 1px solid var(--chip-brd); border-radius: 9px;
  padding: 6px 8px; font-size: 13px; text-align: right; outline: none; font-variant-numeric: tabular-nums;
}
input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent); height: 22px; }
.settings-body button:disabled, .settings-body input:disabled, .settings-body select:disabled {
  opacity: .45; pointer-events: none;
}
.refused-box { background: rgba(180,60,40,.22); border: 1px solid rgba(255,140,110,.35); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; line-height: 1.5; }
.refused-box b { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .06em; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text);
  border-radius: 12px; padding: 10px 18px; font-size: 13.5px; font-weight: 600;
}
.btn.secondary { background: var(--chip); border-color: var(--chip-brd); color: var(--dim); }
.diag-tree { font-size: 12.5px; line-height: 1.7; font-variant-numeric: tabular-nums; }
.diag-k { color: var(--faint); }
.diag-v { color: var(--text); font-weight: 500; }
.diag-group { margin: 6px 0 2px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.about-name { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.about-sub { color: var(--dim); font-size: 13px; margin-top: 4px; line-height: 1.6; }

/* ---------- NAV ---------- */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: center; gap: 2px;
  padding: 7px 10px calc(9px + env(safe-area-inset-bottom, 0px));
  background: var(--nav-bg);
  border-top: 1px solid var(--hairline);
}
/* Phone-sized viewports: the Control4 mobile app draws its own persistent
   bottom bar OVER the WebView. Float our nav as a pill above that chrome
   (host bar + iOS home indicator ≈ 84px) so it stays tappable. Wide
   viewports (T3/T4 panels, >=521px) keep the field-verified full-width bar. */
@media (max-width: 520px) {
  /* NOTE: the C4 mobile webview reports env(safe-area-inset-bottom)
     INCLUDING the app's own bottom bar (~78px), so the inset alone
     clears the host chrome — add only a small visual gap. */
  #nav {
    left: 10px; right: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    padding: 6px 8px;
    border: 1px solid var(--hairline);
    border-radius: 24px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  .screen { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); }
  .nav-badge { border-color: transparent; }
}
.nav-item {
  flex: 1; max-width: 108px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px 5px; border-radius: 13px; color: var(--faint); position: relative;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item .lbl { font-size: 9px; font-weight: 600; letter-spacing: .1em; }

  for (var tI = 0; tI < trop.length; tI++) mkLayer(irTropicalUrl(bbox, W, H, trop[tI]), '');

  stage.appendChild(loading);

  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 };
    stage.className = 'istage dragging';
    if (iradar.dragCommitTimer) { window.clearTimeout(iradar.dragCommitTimer); iradar.dragCommitTimer = null; }

  });
  stage.addEventListener('pointermove', function (e) {

  });
  function endDrag() {

    drag = null;
    stage.className = 'istage';
    if (Math.abs(d.dx) < 4 && Math.abs(d.dy) < 4) { layers.style.transform = ''; return; }
    var s = irSpans(W, H);
    var c = irCenter();
    iradar.center = {
      lat: Math.max(-85, Math.min(85, c.lat + d.dy * (s.latSpan / H))),
      lon: c.lon - d.dx * (s.lonSpan / W)

    iradar.dragCommitTimer = window.setTimeout(function () {
      iradar.dragCommitTimer = null;

  bar.appendChild(tb('Home', 'home', false, function () {

    irLoadCatalog(onCatalog);
  }));
  var newest = iradar.times.length > 0 ? iradar.times[iradar.times.length - 1] : null;
  var stampEl = el('span', 'radar-stamp', newest !== null ? 'Updated ' + fmtClock(new Date(newest)) : 'Loading frames…');
  stampEl.id = 'iStamp';

  root.appendChild(bar);
  root.appendChild(el('div', 'radar-note', 'Base reflectivity with official NWS warning polygons. Drag to pan, Home recenters on the property. Times shown in local time.'));

  /* bootstrap: enumerate real frame times + view-local tropical probe
     (no-ops when the 30-min per-bbox cache entry is still fresh) */

/* interactive-radar tickers (guards keep them inert off-screen) */

  if (activeScreen !== 'radar' || iradar.mode !== 'interactive' || iradar.failed || !iradar.playing) return;

function sendSettingsPatch(paths) {
  /* paths: array of {path, value}. Optimistic, revert refused. */
  if (!state) return;
  if (cloudMode) return; /* cloud mirror is read-only */
  if (!state.settings || typeof state.settings !== 'object') state.settings = {};
  var snapshot = JSON.parse(JSON.stringify(state.settings));
  var patch = {};
  for (var i = 0; i < paths.length; i++) {
    setPath(patch, paths[i].path, paths[i].value);
    setPath(state.settings, paths[i].path, paths[i].value);
    if (paths[i].path.indexOf('units.') === 0 && state.units) {
      /* keep the "what the numbers are" mirror plausible until next poll */
    }
  }
  lastSettingsJson = JSON.stringify(state.settings);
  try { applyTheme(); Scene.setWeather(); } catch (e0) {}
  sendCommand('ATMOS_SET_SETTINGS', { SETTINGS: JSON.stringify(patch) }, function (resp) {
    if (!resp) return; /* no ack channel — trust optimistic value */
    var refused = (resp && resp.refused) || [];
    if (refused.length > 0) {
      refusedWarnings = [];
      for (var r = 0; r < refused.length; r++) {
        var p = String(refused[r].path || '');
        var prev = getPath(snapshot, p);
        if (p) setPath(state.settings, p, prev);
        refusedWarnings.push({ path: p, reason: String(refused[r].reason || 'refused by driver') });
      }
      lastSettingsJson = JSON.stringify(state.settings);
      if (activeScreen === 'settings') renderSettings(true);
      try { applyTheme(); Scene.setWeather(); } catch (e1) {}
    }
  });
  window.setTimeout(function () { requestState(); }, 900);
}

function rowSlider(label, min, max, step, value, unit, path) {
  var row = el('div', 'slider-row');

  top.appendChild(el('div', 'sl', label + (unit ? ' (' + unit + ')' : '')));
  var numIn = el('input', 'slider-num');

  var v = num(value);

  top.appendChild(numIn);
  row.appendChild(top);
  var range = document.createElement('input');
  range.type = 'range';
  range.min = String(min); range.max = String(max); range.step = String(step);
  range.value = v === null ? String(min) : String(v);
  row.appendChild(range);
  function commit(raw) {
    var n = num(raw);
    if (n === null) return;
    n = Math.max(min, Math.min(max, n));
    numIn.value = String(n);
    range.value = String(n);
    sendSettingsPatch([{ path: path, value: n }]);
  }
  range.addEventListener('input', function () { numIn.value = range.value; });
  range.addEventListener('change', function () { commit(range.value); });
  numIn.addEventListener('change', function () { commit(numIn.value); });
  return row;

      rg.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
      if (hot) {
        var sx = (elapsed / 40) % (W + 600) - 300;
        var rg2 = ctx.createRadialGradient(sx, H * 0.8, 20, sx, H * 0.8, W * 0.5);
        rg2.addColorStop(0, 'rgba(255,140,60,0.10)');
        rg2.addColorStop(1, 'rgba(255,140,60,0)');
        ctx.fillStyle = rg2;
        ctx.fillRect(0, 0, W, H);
      }
    }
    /* stars */
    for (i = 0; i < stars2.length; i++) {
      p = stars2[i];
      var tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(p.ph + elapsed / 900 * p.sp));
      ctx.fillStyle = 'rgba(230,238,255,' + (tw * 0.85).toFixed(3) + ')';
      ctx.fillRect(p.x, p.y, p.r, p.r);
    }
    /* clouds */
    for (i = 0; i < cloudsArr.length; i++) {
      p = cloudsArr[i];
      p.x += p.v * s;
      if (p.x > W + 200) { p.x = -340 * p.s; p.y = rnd(-30, H * 0.45); }
      ctx.globalAlpha = p.a;
      ctx.drawImage(p.dark ? cloudSpriteDark : cloudSprite, p.x, p.y, 320 * p.s, 160 * p.s);
      ctx.globalAlpha = 1;
    }
    /* fog bands */
    for (i = 0; i < fogBands.length; i++) {
      p = fogBands[i];
      p.x += p.v * s;
      if (p.v > 0 && p.x > W) p.x = -W;
      if (p.v < 0 && p.x < -W) p.x = W;
      var fg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      var fogCol = themeIsLight() ? '255,255,255' : '190,205,220';
      fg.addColorStop(0, 'rgba(' + fogCol + ',0)');
      fg.addColorStop(0.5, 'rgba(' + fogCol + ',' + p.a.toFixed(3) + ')');
      fg.addColorStop(1, 'rgba(' + fogCol + ',0)');
      ctx.fillStyle = fg;
      ctx.fillRect(p.x - W, p.y, W * 2, p.h);
      ctx.fillRect(p.x + W, p.y, W * 2, p.h);
    }
    /* rain */
    if (rain.length) {
      ctx.lineWidth = 1.1;
      ctx.lineCap = 'round';
      for (i = 0; i < rain.length; i++) {
        p = rain[i];
        p.y += p.v * s; p.x += p.drift * s;
        if (p.y > H + 30) { p.y = rnd(-60, -10); p.x = rnd(-20, W + 60); }
        if (p.x < -50) p.x = W + 40;
        ctx.strokeStyle = 'rgba(170,200,235,' + p.a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.drift * 0.02, p.y - p.l);
        ctx.stroke();
      }
    }
    /* snow */
    for (i = 0; i < snow.length; i++) {
      p = snow[i];
      p.y += p.v * s;
      var sxx = p.x + Math.sin(p.ph + elapsed / 1600) * p.sw;
      if (p.y > H + 6) { p.y = rnd(-30, -4); p.x = rnd(0, W); }
      ctx.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(sxx, p.y, p.r, 0, 6.283);
      ctx.fill();
    }
    /* wind streaks */
    if (streaks.length) {
      ctx.lineWidth = 1;
      for (i = 0; i < streaks.length; i++) {
        p = streaks[i];
        p.x += p.v * s;
        if (p.x > W + 100) { p.x = -p.l - rnd(0, 200); p.y = rnd(0, H); }
        ctx.strokeStyle = 'rgba(200,225,240,' + p.a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.l, p.y - p.l * 0.06);
        ctx.stroke();
      }
    }
    /* ice crystals */
    for (i = 0; i < crystals.length; i++) {
      p = crystals[i];
      p.y += p.vy * s;
      if (p.y > H + 8) { p.y = -8; p.x = rnd(0, W); }
      var glint = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(p.ph + elapsed / 700 * p.sp));
      ctx.strokeStyle = 'rgba(210,240,255,' + glint.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x - p.r, p.y); ctx.lineTo(p.x + p.r, p.y);
      ctx.moveTo(p.x, p.y - p.r); ctx.lineTo(p.x, p.y + p.r);
      ctx.moveTo(p.x - p.r * 0.6, p.y - p.r * 0.6); ctx.lineTo(p.x + p.r * 0.6, p.y + p.r * 0.6);
      ctx.moveTo(p.x + p.r * 0.6, p.y - p.r * 0.6); ctx.lineTo(p.x - p.r * 0.6, p.y + p.r * 0.6);
      ctx.stroke();
    }
    /* lightning */
    var stormy = mode === 'THUNDERSTORM' || mode === 'SEVERE_STORM' || mode === 'HURRICANE';
    if (stormy && effIdx() >= 2) {
      if (t > nextLightning) {
        flash = 1;
        nextLightning = t + rnd(8000, 20000) / (effIdx() >= 3 ? 1.6 : 1);
      }
      if (flash > 0) {
        ctx.fillStyle = 'rgba(235,240,255,' + (flash * 0.5).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
        flash -= dt / 80; /* ~80ms decay */
        if (flash < 0) flash = 0;
      }
    }
  }
  function start() {
    if (raf === null && !document.hidden) { lastT = 0; raf = window.requestAnimationFrame(frame); }
  }
  function stop() {
    if (raf !== null) { window.cancelAnimationFrame(raf); raf = null; }
  }
  function setWeather() {
    var newMode = String(state && state.mode || 'UNKNOWN');
    var newDay = getPath(state, 'solar.isDaytime') !== false;
    var tierName = String(getPath(state, 'settings.display.animation') || 'NORMAL').toUpperCase();
    var newIdx = TIERS.indexOf(tierName);
    if (newIdx < 0) newIdx = 2;
    var changed = newMode !== mode || newDay !== isDay;
    if (newIdx !== settingIdx) { settingIdx = newIdx; dropCount = 0; changed = true; }
    mode = newMode; isDay = newDay;
    if (changed) rebuild();
    if (effIdx() === 0) { stop(); drawStatic(); } else start();
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else { samples = []; sampleSum = 0; start(); if (effIdx() === 0) drawStatic(); }
  });
  resize();
  start();
  return { setWeather: setWeather, stop: stop, start: start, resizeNow: resize };
})();

/* ================= NAV & SCREENS ================= */
var NAV = [
  ['now', 'Now', 'home'], ['hourly', 'Hourly', 'clock'], ['forecast', 'Forecast', 'calendar'],
  ['radar', 'Radar', 'radar'], ['alerts', 'Alerts', 'alertTri'], ['details', 'Details', 'grid'],
  ['settings', 'Settings', 'sliders']
];
var SCREENS_BY_ID = { now: renderNow, hourly: renderHourly, forecast: renderForecast, radar: renderRadar, alerts: renderAlerts, details: renderDetails, settings: renderSettings };

function buildNav() {
  var nav = $('nav');
  clear(nav);
  for (var i = 0; i < NAV.length; i++) {
    (function (id, label, icon) {
      var b = el('button', 'nav-item');
      b.id = 'nav-' + id;
      b.setAttribute('aria-label', label);
      b.appendChild(iconNode(icon));
      b.appendChild(el('span', 'lbl', label));
      b.addEventListener('click', function () { userNavigated = true; showScreen(id, true); });
      nav.appendChild(b);
    })(NAV[i][0], NAV[i][1], NAV[i][2]);
  }
}
function updateNavBadge() {
  var b = $('nav-alerts');
  if (!b) return;
  var old = b.querySelector('.nav-badge');
  if (old) b.removeChild(old);
  var n = state ? (num(state.alert_count) !== null ? state.alert_count : (state.alerts || []).length) : 0;
  if (n > 0) b.appendChild(el('span', 'nav-badge', n > 9 ? '9+' : String(n)));
}
function showScreen(id, persist) {
  if (!SCREENS_BY_ID[id]) id = 'now';
  activeScreen = id;
  var i;
  var screens = document.querySelectorAll('.screen');
  for (i = 0; i < screens.length; i++) screens[i].className = 'screen';
  var target = $('screen-' + id);
  if (target) target.className = 'screen active';
  var items = document.querySelectorAll('.nav-item');
  for (i = 0; i < items.length; i++) items[i].className = 'nav-item';
  var nb = $('nav-' + id);
  if (nb) nb.className = 'nav-item active';
  if (persist) { try { window.localStorage.setItem('atmos.screen', id); } catch (e) {} }
  $('screens').scrollTop = 0;
  renderActive();
  updateNavBadge();
}
function renderActive() {
  var fn = SCREENS_BY_ID[activeScreen];
  if (fn) { try { fn(); } catch (e) { try { console.log('[atmosphere] render error: ' + e.message); } catch (e2) {} } }
  updateNavBadge();
}

/* ================= boot ================= */
buildNav();
if (mockMode) $('mockBadge').hidden = false;
var initialScreen = 'now';
try { initialScreen = window.localStorage.getItem('atmos.screen') || 'now'; } catch (e) {}
showScreen(SCREENS_BY_ID[initialScreen] ? initialScreen : 'now', false);
requestState();
window.setInterval(function () {
  if (cloudMode && !mockMode) {
    var nowMs = Date.now();
    /* every 5 min, try to climb back to C4 / LAN relay */
    if (nowMs - lastUpgradeMs >= 300000) { lastUpgradeMs = nowMs; tryBetterChannels(); }
    /* 60 s cloud cadence (interval ticks every 30 s) */
    if (nowMs - lastCloudPollMs >= 55000) cloudGetState();
    return;
  }
  requestState();
}, 30000);
/* Fallback probe: if the Navigator JS API has delivered nothing within
   4 s of load, try the LAN relay, or the cloud mirror when no relay
   address was provided. */
if ((relayBase !== null || cloudBase !== null) && !mockMode) {
  window.setTimeout(function () {
    relayProbed = true;
    lastUpgradeMs = Date.now();
    if (!c4Delivered) {
      if (relayBase !== null) relayGetState();
      else cloudGetState();
    }
  }, 4000);
}
window.setInterval(function () {
  updateClock();
  var chan = $('chanStatus');
  if (chan) chan.textContent = channelStatusText();
  if (activeScreen === 'now' && state) {
    var arc = document.querySelector('.sun-arc');
    if (arc) positionSunDot(arc, state.solar || {});
  }
}, 1000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) requestState();
});
})();
