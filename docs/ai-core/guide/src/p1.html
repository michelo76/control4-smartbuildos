<title>SmartBuildOS AI Core Guide</title>
<style>
/* Tokens borrowed from System Studio (smartbuildos-ai-core
   src/components/system-studio/workspace/StudioWorkspace.module.css, --sw-*).
   The light theme uses the Studio values as written; the dark theme is built
   from the Studio navy tokens. */
:root {
  --sw-navy: #0d1b2a; --sw-navy-2: #13253a; --sw-navy-rule: #24384f; --sw-navy-text: #e8eef5; --sw-navy-muted: #9fb0c3;
  --sw-canvas: #f7f5f2; --sw-surface: #ffffff; --sw-surface-2: #faf8f5; --sw-surface-3: #f2efea;
  --sw-rule: #e6e1d9; --sw-rule-strong: #d6cfc4; --sw-ink: #1b1f24; --sw-ink-2: #3b4148; --sw-muted: #5f656d;
  --sw-orange: #f26a1b; --sw-orange-ink: #b93d0b; --sw-orange-soft: #fff1e8; --sw-orange-rule: #f6c3a1;
  --sw-green: #15803d; --sw-amber: #b45309; --sw-red: #b91c1c; --sw-blue: #1d4ed8; --sw-gray: #8a919a;
  --sw-focus: #f26a1b; --sw-radius: 8px;
  --tone-sim-bg: #eaf1ff; --tone-sim-ink: #1e3a8a; --tone-sim-rule: #b9cdf5;
  --tone-dev-bg: #fff6e0; --tone-dev-ink: #7a4306; --tone-dev-rule: #f1d08a;
  --tone-block-bg: #fdecec; --tone-block-ink: #8a1c1c; --tone-block-rule: #f2b8b8;
  --tone-ok-bg: #e8f6ec; --tone-ok-ink: #14532d; --tone-ok-rule: #a9dbb8;
  --code-bg: #f2efea; --code-ink: #1b1f24; --mark: #ffe08a; --mark-ink: #1b1f24;
  --shadow: 0 10px 30px rgba(13,27,42,.12);
  --header-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sw-canvas: #0b1622; --sw-surface: #112233; --sw-surface-2: #13283c; --sw-surface-3: #1a3249;
    --sw-rule: #24384f; --sw-rule-strong: #34506d; --sw-ink: #e8eef5; --sw-ink-2: #c9d4e0; --sw-muted: #a9b8c8;
    --sw-orange: #f7894a; --sw-orange-ink: #ffab78; --sw-orange-soft: #2b2018; --sw-orange-rule: #6b3a1c;
    --sw-green: #4ade80; --sw-amber: #fbbf24; --sw-red: #f87171; --sw-blue: #93b4ff; --sw-focus: #ffab78;
    --tone-sim-bg: #12264a; --tone-sim-ink: #c7d8ff; --tone-sim-rule: #2c4a80;
    --tone-dev-bg: #2e2410; --tone-dev-ink: #fde3a7; --tone-dev-rule: #6b5420;
    --tone-block-bg: #351616; --tone-block-ink: #fecaca; --tone-block-rule: #7a2b2b;
    --tone-ok-bg: #10291a; --tone-ok-ink: #bbf7d0; --tone-ok-rule: #2b6140;
    --code-bg: #0b1a29; --code-ink: #e8eef5; --mark: #7a5c00; --mark-ink: #fff7d6;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sw-canvas: #0b1622; --sw-surface: #112233; --sw-surface-2: #13283c; --sw-surface-3: #1a3249;
  --sw-rule: #24384f; --sw-rule-strong: #34506d; --sw-ink: #e8eef5; --sw-ink-2: #c9d4e0; --sw-muted: #a9b8c8;
  --sw-orange: #f7894a; --sw-orange-ink: #ffab78; --sw-orange-soft: #2b2018; --sw-orange-rule: #6b3a1c;
  --sw-green: #4ade80; --sw-amber: #fbbf24; --sw-red: #f87171; --sw-blue: #93b4ff; --sw-focus: #ffab78;
  --tone-sim-bg: #12264a; --tone-sim-ink: #c7d8ff; --tone-sim-rule: #2c4a80;
  --tone-dev-bg: #2e2410; --tone-dev-ink: #fde3a7; --tone-dev-rule: #6b5420;
  --tone-block-bg: #351616; --tone-block-ink: #fecaca; --tone-block-rule: #7a2b2b;
  --tone-ok-bg: #10291a; --tone-ok-ink: #bbf7d0; --tone-ok-rule: #2b6140;
  --code-bg: #0b1a29; --code-ink: #e8eef5; --mark: #7a5c00; --mark-ink: #fff7d6;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sw-canvas); color: var(--sw-ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; }
a { color: var(--sw-orange-ink); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--sw-focus); outline-offset: 2px; border-radius: 3px; }
[tabindex="-1"]:focus { outline: none; }
button, input, select, textarea { font: inherit; color: inherit; }
code, kbd, pre, samp { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .88em; }
code { background: var(--code-bg); color: var(--code-ink); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { line-height: 1.25; color: var(--sw-ink); }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); letter-spacing: -.02em; margin: .2em 0 .4em; }
h2 { font-size: 1.35rem; margin: 2.2em 0 .6em; padding-top: .4em; border-top: 1px solid var(--sw-rule); }
h3 { font-size: 1.08rem; margin: 1.6em 0 .5em; }
p, li { color: var(--sw-ink-2); }
strong { color: var(--sw-ink); }
main p, main li, main td, main dd, main summary, main dt { overflow-wrap: break-word; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 100; background: var(--sw-orange-ink); color: #fff; padding: 10px 14px; border-radius: 6px; font-weight: 600; }
.skip:focus { top: 10px; }
[hidden] { display: none !important; }

/* ── Header ─────────────────────────────────────────────── */
.topbar { position: sticky; top: 0; z-index: 40; height: var(--header-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--sw-navy); color: var(--sw-navy-text); border-bottom: 1px solid #0a1520; }
.topbar .brand { flex: none; display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: inherit; white-space: nowrap; }
.topbar .brand b { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; color: #fff; }
.topbar .brand b span { color: #f7894a; }
.topbar .brand b span.b1 { color: #fff; }
.topbar .brand em { font-style: normal; color: var(--sw-navy-muted); font-size: .92rem; }
.iconbtn { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--sw-navy-rule); background: var(--sw-navy-2); color: #fff; cursor: pointer; }
.iconbtn:hover { background: #1b3350; }
.iconbtn svg { width: 20px; height: 20px; }
.menu-btn { display: none; }
.search { position: relative; margin-left: auto; flex: 0 1 380px; min-width: 60px; }
.search input { width: 100%; height: 40px; padding: 0 70px 0 36px; border-radius: 8px; border: 1px solid var(--sw-navy-rule); background: var(--sw-navy-2); color: #fff; }
.search input::placeholder { color: var(--sw-navy-muted); }
.search .glass { position: absolute; left: 10px; top: 10px; width: 18px; height: 18px; color: var(--sw-navy-muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--sw-navy-muted); cursor: pointer; }
.search .clear:hover { color: #fff; background: #1b3350; }
.results { position: absolute; top: calc(100% + 8px); right: 0; width: min(560px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto; background: var(--sw-surface); color: var(--sw-ink); border: 1px solid var(--sw-rule); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; z-index: 60; }
.results p.count { margin: 4px 8px 8px; font-size: .85rem; color: var(--sw-muted); }
.results ol { list-style: none; margin: 0; padding: 0; }
.results li a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: inherit; }
.results li a:hover, .results li a:focus-visible { background: var(--sw-surface-3); }
.results li a b { display: block; font-size: .92rem; }
.results li a small { display: block; color: var(--sw-muted); font-size: .84rem; overflow-wrap: anywhere; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.progress { position: fixed; top: var(--header-h); left: 0; height: 3px; width: 0; background: var(--sw-orange); z-index: 41; }

/* ── Layout ─────────────────────────────────────────────── */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.sidebar { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow: auto; background: var(--sw-surface); border-right: 1px solid var(--sw-rule); padding: 16px 10px 40px; }
.sidebar h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--sw-muted); border: 0; margin: 6px 10px 8px; padding: 0; }
.sidebar ol { list-style: none; margin: 0; padding: 0; }
.sidebar a.chap { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--sw-ink-2); text-decoration: none; font-size: .93rem; line-height: 1.3; }
.sidebar a.chap:hover { background: var(--sw-surface-3); color: var(--sw-ink); }
.sidebar a.chap[aria-current="page"] { background: var(--sw-orange-soft); color: var(--sw-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--sw-orange); }
.sidebar .num { font-variant-numeric: tabular-nums; color: var(--sw-muted); font-size: .82rem; text-align: right; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--sw-rule-strong); background: transparent; }
.dot[data-state="visited"] { border-color: var(--sw-orange); background: linear-gradient(90deg, var(--sw-orange) 50%, transparent 50%); }
.dot[data-state="done"] { border-color: var(--sw-green); background: var(--sw-green); }
.sidebar .legend { margin: 14px 10px 0; font-size: .78rem; color: var(--sw-muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sidebar .legend span { display: inline-flex; align-items: center; gap: 4px; }
.sidebar .subnav { margin: 2px 0 8px 40px; border-left: 1px solid var(--sw-rule); padding-left: 8px; }
.sidebar .subnav a { display: block; padding: 4px 6px; font-size: .84rem; color: var(--sw-muted); text-decoration: none; border-radius: 6px; }
.sidebar .subnav a:hover { color: var(--sw-ink); background: var(--sw-surface-3); }
.scrim { display: none; }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.chapter { max-width: 900px; margin: 0 auto; }
.chapter .eyebrow { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sw-orange-ink); font-weight: 700; }
.chapter .lede { font-size: 1.06rem; color: var(--sw-ink-2); }
.chapter-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--sw-rule); flex-wrap: wrap; }
.chapter-nav a { display: inline-flex; flex-direction: column; gap: 2px; padding: 10px 14px; border: 1px solid var(--sw-rule); border-radius: 8px; text-decoration: none; background: var(--sw-surface); color: var(--sw-ink); max-width: 100%; }
.chapter-nav a small { color: var(--sw-muted); }
.chapter-nav a:hover { border-color: var(--sw-orange-rule); }
.wide { max-width: 1120px; margin-left: auto; margin-right: auto; }

/* ── Components ─────────────────────────────────────────── */
.card { background: var(--sw-surface); border: 1px solid var(--sw-rule); border-radius: var(--sw-radius); padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.table-wrap { position: relative; overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--sw-rule); border-radius: var(--sw-radius); background: var(--sw-surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--sw-rule); }
th { background: var(--sw-surface-2); color: var(--sw-ink); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td code { white-space: normal; }
.status { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 14px; margin: 14px 0; border-radius: var(--sw-radius); border: 1px solid; }
.status svg { width: 22px; height: 22px; margin-top: 2px; }
.status b { display: block; color: inherit; }
.status p { margin: 2px 0 0; color: inherit; font-size: .93rem; }
.status small { display: block; margin-top: 4px; opacity: .9; font-size: .82rem; }
.status[data-tone="sim"] { background: var(--tone-sim-bg); color: var(--tone-sim-ink); border-color: var(--tone-sim-rule); }
.status[data-tone="dev"] { background: var(--tone-dev-bg); color: var(--tone-dev-ink); border-color: var(--tone-dev-rule); }
.status[data-tone="block"] { background: var(--tone-block-bg); color: var(--tone-block-ink); border-color: var(--tone-block-rule); }
.status[data-tone="ok"] { background: var(--tone-ok-bg); color: var(--tone-ok-ink); border-color: var(--tone-ok-rule); }
.status code { background: rgba(127,127,127,.18); color: inherit; }
.note { border-left: 4px solid var(--sw-orange); background: var(--sw-orange-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 14px 0; }
.note p { margin: 0; color: var(--sw-ink); }
.label-sim { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--tone-dev-bg); color: var(--tone-dev-ink); border: 1px solid var(--tone-dev-rule); }
pre.code { position: relative; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--sw-rule); border-radius: var(--sw-radius); padding: 14px 16px; padding-top: 40px; overflow-x: auto; font-size: .84rem; line-height: 1.5; margin: 12px 0 18px; white-space: pre; }
pre.code code { background: none; padding: 0; font-size: inherit; white-space: pre; overflow-wrap: normal; }
pre.code .lang { position: absolute; top: 9px; left: 14px; font: 600 .7rem/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--sw-muted); }
.copy { position: absolute; top: 6px; right: 6px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--sw-rule-strong); background: var(--sw-surface); color: var(--sw-ink); font-size: .8rem; cursor: pointer; }
.copy:hover { border-color: var(--sw-orange); }
.copy[data-state="ok"] { border-color: var(--sw-green); color: var(--sw-green); }
.copy[data-state="manual"] { border-color: var(--sw-amber); color: var(--sw-amber); }
details { background: var(--sw-surface); border: 1px solid var(--sw-rule); border-radius: var(--sw-radius); margin: 10px 0; }
details > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; color: var(--sw-ink); list-style: none; display: flex; gap: 10px; align-items: center; min-height: 44px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--sw-muted); border-bottom: 2px solid var(--sw-muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details[open] > summary::before { transform: rotate(45deg); }
details > .body { padding: 0 16px 14px; }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 1.5px dotted var(--sw-orange-ink); cursor: help; }
.tip { position: absolute; z-index: 80; max-width: min(340px, calc(100vw - 24px)); background: var(--sw-navy); color: var(--sw-navy-text); padding: 10px 12px; border-radius: 8px; font-size: .86rem; line-height: 1.45; box-shadow: var(--shadow); }
.tip b { color: #fff; display: block; margin-bottom: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--sw-rule-strong); background: var(--sw-surface); color: var(--sw-ink); cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--sw-orange); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--sw-orange-ink); border-color: var(--sw-orange-ink); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1b1f24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1b1f24; } }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.field { display: grid; gap: 4px; margin: 10px 0; min-width: 0; }
.field select, .feature select { width: 100%; }
.filters .field select { width: auto; max-width: 100%; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; color: var(--sw-ink); }
.field small { color: var(--sw-muted); }
.field input[type=text], .field input[type=password], .field input[type=search], .field select, .feature select, .feature input[type=search] { min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--sw-rule-strong); background: var(--sw-surface); max-width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--sw-red); }
.err { color: var(--sw-red); font-weight: 600; font-size: .9rem; }
.ok { color: var(--sw-green); font-weight: 600; }
fieldset { border: 1px solid var(--sw-rule); border-radius: 8px; padding: 8px 12px 10px; margin: 10px 0; min-width: 0; }
legend { font-weight: 600; font-size: .9rem; padding: 0 4px; color: var(--sw-ink); }
.radio { display: flex; gap: 8px; align-items: center; min-height: 32px; }
.feature { background: var(--sw-surface); border: 1px solid var(--sw-rule); border-radius: 12px; padding: 18px; margin: 18px 0 26px; box-shadow: 0 1px 0 rgba(0,0,0,.02); }
.feature > header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.feature > header h3 { margin: 0; font-size: 1.12rem; }
.feature > header .type { white-space: normal; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--sw-rule-strong); background: var(--sw-surface); color: var(--sw-ink-2); cursor: pointer; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--sw-orange-soft); border-color: var(--sw-orange); color: var(--sw-ink); font-weight: 600; }
.type { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--sw-rule-strong); color: var(--sw-ink-2); white-space: nowrap; }
.type[data-t="command"] { border-color: #b9cdf5; color: var(--sw-blue); }
.type[data-t="event"] { border-color: var(--sw-orange-rule); color: var(--sw-orange-ink); }
.type[data-t="variable"] { border-color: #a9dbb8; color: var(--sw-green); }
.type[data-t="property"] { border-color: var(--sw-rule-strong); }
.type[data-t="conditional"], .type[data-t="action"] { border-color: #e2c27a; color: var(--sw-amber); }
.kv { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 4px 14px; font-size: .9rem; }
.kv dt { font-weight: 600; color: var(--sw-ink); }
.kv dd { margin: 0; color: var(--sw-ink-2); overflow-wrap: anywhere; }

/* Wizard */
.steps { display: flex; gap: 4px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0 0 14px; counter-reset: s; }
.steps li { flex: 1 1 90px; font-size: .78rem; padding: 6px 8px; border-radius: 6px; background: var(--sw-surface-3); color: var(--sw-muted); }
.steps li[aria-current="step"] { background: var(--sw-orange-soft); color: var(--sw-ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--sw-orange); }
.steps li[data-done="true"] { color: var(--sw-green); }
.sim-props { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }

/* Architecture */
.arch { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }
.arch svg { width: 100%; height: auto; display: block; }
.node { cursor: pointer; }
.node rect { fill: var(--sw-surface); stroke: var(--sw-rule-strong); stroke-width: 1.5; }
.node text { fill: var(--sw-ink); font: 600 12px system-ui, sans-serif; pointer-events: none; }
.node .sub { fill: var(--sw-muted); font-weight: 400; font-size: 10.5px; }
.node:hover rect, .node:focus rect { stroke: var(--sw-orange); }
.node:focus { outline: none; }
.node:focus-visible rect { stroke: var(--sw-focus); stroke-width: 3; }
.node[aria-pressed="true"] rect { fill: var(--sw-orange-soft); stroke: var(--sw-orange); stroke-width: 2.5; }
.node.related rect { stroke: var(--sw-blue); stroke-dasharray: 4 3; }
