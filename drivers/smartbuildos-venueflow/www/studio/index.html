<script>
/* Installer Studio: the entity editors.
   Sections: devices (discovery and display mapping), sources, zones (audio),
   groups (display groups), ambient (lighting and shades), rooms (room panels)
   and profiles (staff profiles).

   Every section is a list on the left and an editor for the selected item on
   the right. The selection lives in a module variable, so the re-render that
   follows each change keeps the same item open. Changes go through
   Studio.update (silently) followed by a re-render that waits for the pointer
   to be released and puts the keyboard focus back where it was, so a click on
   the next control right after typing is not lost. */
(function () {
  'use strict';
  var h = VF.h, icon = VF.icon, S = Studio;
  var MINE = { devices: 1, sources: 1, zones: 1, groups: 1, ambient: 1, rooms: 1, profiles: 1 };

  /* ── a re-render that keeps the installer's place ────────────────────── */
  var wanted = false, timer = null, downAt = 0, downEl = null, changedEl = null;
  document.addEventListener('pointerdown', function (e) { downAt = Date.now(); downEl = e.target; }, true);
  ['pointerup', 'pointercancel'].forEach(function (n) { document.addEventListener(n, function () { downAt = 0; if (wanted) later(60); }, true); });
  document.addEventListener('click', function () { downAt = 0; }, true);
  document.addEventListener('change', function (e) { changedEl = e.target; downAt = 0; }, true);
  document.addEventListener('focusin', function (e) { var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) t._enInit = t.value; }, true);
  function later(ms) { clearTimeout(timer); timer = setTimeout(run, ms || 0); }
  function refresh() { wanted = true; later(0); }

  function labelOf(el) {
    var own = el.getAttribute('aria-label'); if (own) return own;
    var wrap = el.closest('label, .en-fld');
    if (wrap) {
      for (var i = 0; i < wrap.childNodes.length; i++) {
        var n = wrap.childNodes[i];
        if (n.nodeType === 3 && n.textContent.trim()) return n.textContent.trim();
        if (n.nodeType === 1 && n.tagName === 'SPAN') return n.textContent.trim();
      }
    }
    return el.tagName === 'BUTTON' ? el.textContent.trim().slice(0, 40) : '';
  }
  function focusKey(el) { var scope = el.closest('[data-fk]'); return (scope ? scope.dataset.fk : '') + '|' + el.tagName + '|' + (el.type || '') + '|' + labelOf(el); }
  function findByKey(root, key) {
    var all = root.querySelectorAll('input, select, textarea, button');
    for (var i = 0; i < all.length; i++) { if (focusKey(all[i]) === key) return all[i]; }
    return null;
  }
  function run() {
    if (!wanted) return;
    if (!MINE[S.currentSection()]) { wanted = false; return; }
    if (downAt && Date.now() - downAt < 700) { later(90); return; }   /* let the click land first */
    var main = document.getElementById('main'); if (!main) return;
    var a = document.activeElement, inside = !!(a && a !== document.body && main.contains(a));
    if (inside && a.tagName === 'SELECT' && a !== changedEl && a === downEl) {   /* a pick list opened by touch or mouse would close */
      if (!a._enWait) {
        a._enWait = true;
        var go = function () { a._enWait = false; a.removeEventListener('blur', go); a.removeEventListener('change', go); later(0); };
        a.addEventListener('blur', go); a.addEventListener('change', go);
      }
      return;
    }
    var keep = null;
    if (inside) {
      keep = { key: focusKey(a), value: null, s: null, e: null };
      if ((a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'radio') || a.tagName === 'TEXTAREA') {
        if (a !== changedEl && a._enInit !== undefined && a.value !== a._enInit) keep.value = a.value;   /* typed, not committed yet */
        try { keep.s = a.selectionStart; keep.e = a.selectionEnd; } catch (e) { /* number fields have no selection */ }
      }
    }
    var scrolls = {};
    main.querySelectorAll('[data-en-scroll]').forEach(function (el) { scrolls[el.dataset.enScroll] = el.scrollTop; });
    wanted = false; changedEl = null; downEl = null;
    S.refresh();
    main.querySelectorAll('[data-en-scroll]').forEach(function (el) { var v = scrolls[el.dataset.enScroll]; if (v) el.scrollTop = v; });
    if (!keep) return;
    var el = findByKey(main, keep.key); if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    if (keep.value !== null && el.value !== keep.value) {
      el.value = keep.value;
      var fired = false;
      el.addEventListener('change', function () { fired = true; });
      el.addEventListener('blur', function () { if (!fired) el.dispatchEvent(new Event('change', { bubbles: true })); });
    }
    if (keep.s !== null && keep.s !== undefined) { try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* ignore */ } }
  }

  /* ── small helpers ───────────────────────────────────────────────────── */
  function upd(label, fn) { S.update(label, fn, { silent: true }); refresh(); }
  function edit(field, id, label, fn) { upd(label, function (c) { var x = VF.byId(c[field], id); if (x) fn(x, c); }); }
  function schema() { return (S.boot && S.boot.schema) || {}; }
  function limitOf(field) { var l = VF.asMap(schema().limits); return l[field] || 9999; }
  function atLimit(field, plural) {
    if (S.list(field).length < limitOf(field)) return false;
    VF.toast('This configuration already holds the most ' + plural + ' it can (' + limitOf(field) + ').', 'warn'); return true;
  }
  function uniqueName(field, base) {
    var names = S.list(field).map(function (x) { return x.name; });
    if (names.indexOf(base) < 0) return base;
    for (var n = 2; ; n++) { if (names.indexOf(base + ' ' + n) < 0) return base + ' ' + n; }
  }
  function words(s) { s = String(s || '').replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function multiFloor() { return S.list('floors').length > 1; }
  function areaText(areaId) {
    var a = S.find('areas', areaId); if (!a) return areaId ? '(missing area)' : 'No area';
    return multiFloor() ? S.nameOf('floors', a.floorId, '?') + ' · ' + a.name : a.name;
  }
  function areaOptions(floorId) {
    return S.list('areas').filter(function (a) { return !floorId || a.floorId === floorId; }).map(function (a) { return { value: a.id, label: floorId ? a.name : areaText(a.id) }; });
  }
  function opts(values, labels) { return VF.asList(values).map(function (v) { return { value: v, label: (labels && labels[v]) || words(v) }; }); }
  function fld(label, control, hint) { return h('div.en-fld', h('span.en-fld-l', label), control, hint ? h('span.hint', hint) : null); }
  function card(title, body, extra) { return h('div.card.col.en-card', h('div.row.between', h('h3', title), extra || null), body); }
  function note(text, kind, ic) { return h('div.banner.' + (kind || 'info') + '.en-note', icon(ic || 'info', 'sm'), h('div.small', text)); }
  function nameField(label, value, apply) {
    return S.text(label, value, function (v) {

        h('div.stat', icon('clock', 'lg'), h('div.col.tight', h('span.small.muted', 'Controller local time (when this Studio loaded)'), h('b', ctl.localTime || 'Not reported')))),
      h('ul.vp-facts',
        h('li', 'Schedules follow the controller\'s clock and time zone (Composer, Project Settings), not this device\'s.'),
        h('li', 'When clocks go forward, a schedule inside the skipped hour runs once, right after the change.'),
        h('li', 'When clocks go back, a schedule in the repeated hour runs once.'),
        h('li', 'A schedule missed while the controller was off is not run late.')));
    var overlaps = live(h('div'), function (el) {
      var list = S.issues().filter(function (i) { return i.code === 'SCHEDULE_OVERLAP'; });
      VF.mount(el, list.length ? h('div.col.tight', list.map(function (i) {
        return h('div.banner.warn', icon('alert', 'sm'), h('div.small.grow', i.message), i.entity && i.entity.kind === 'rule' ? btn('.ghost', 'edit', 'Open', function () { openRule(i.entity.id); }) : null);
      })) : null);
    });
    var upcoming = live(h('div.col.tight'), function (el) {
      var list = asList(runs.data && runs.data.upcoming);
      if (!runs.data) { VF.mount(el, h('div.small.muted', runs.error || 'Reading the next runs...')); return; }
      if (!list.length) { VF.mount(el, h('div.small.muted', S.published ? 'No enabled schedule in the published configuration.' : 'Nothing is published yet, so nothing is scheduled.')); return; }
      VF.mount(el, list.map(function (u) {
        var known = S.find('rules', u.ruleId);
        return h('div.item.vp-next',
          h('span.vp-slot-time', u.time),
          h('div.grow', h('div.ellipsis', u.name), h('div.small.muted', (u.inDays === 0 ? 'Today' : (u.inDays === 1 ? 'Tomorrow' : 'In ' + u.inDays + ' days')) + ', ' + (DAY_LONG[u.weekday - 1] || ''))),
          known ? btn('.ghost', 'edit', 'Edit', function () { openRule(u.ruleId); }) : h('span.chip', { title: 'This schedule is in the published configuration but no longer in the draft.' }, 'Not in the draft'));
      }));
    });
    var list = rules.length ? h('div.list', rules.slice().sort(function (a, b) { return String(a.trigger.time || '').localeCompare(String(b.trigger.time || '')); }).map(function (r) {
      return ruleRow(r, { short: true, onOpen: function () { openRule(r.id); }, actions: h('div.row.tight',
        btn('.ghost', 'edit', 'Edit', function () { openRule(r.id); }, 'sd:' + r.id + ':ed'),
        iconBtn('trash', 'Delete ' + r.name, function () { S.confirmRemove('rule', r.id, 'rule'); }, 'sd:' + r.id + ':rm', { danger: true })) });
    })) : h('div.empty', h('p', 'No schedules yet. "Schedule a scene" runs a scene at a time of day on the days you choose.'));
    VF.mount(container,
      S.sectionHead('Scheduling', 'Rules that start at a time of day. Each one is a rule you can open and extend under Visual Programming.', [btn('.primary', 'plus', 'Schedule a scene', scheduleSceneDialog, 'sd:add')]),
      h('div.col',
        clock, overlaps,
        h('div.panel', h('div.panel-head', icon('calendar'), h('h3.grow', 'Week'), h('span.small.muted', 'From the draft. Tap a schedule to edit it.')), h('div.panel-body', weekView(rules))),
        h('div.vp-sched-cols',
          h('div.panel', h('div.panel-head', icon('list'), h('h3.grow', 'Schedules'), h('span.chip', String(rules.length))), h('div.panel-body', list)),
          h('div.panel', h('div.panel-head', icon('clock'), h('h3.grow', 'Next runs'), btn('.ghost', 'refresh', 'Refresh', function () { loadRuns(); }, 'sd:refresh')),
            h('div.panel-body.col', h('p.small.muted', 'From the published configuration, as the controller will run them. Publish the draft to include your changes.'), upcoming)))));
  }

  /* ── registration ────────────────────────────────────────────────────── */
  function countIssues(kind) { var n = S.issues().filter(function (i) { return i.entity && i.entity.kind === kind; }).length; return n || null; }
  function kindOfBadge(kind) { return S.issues().some(function (i) { return i.entity && i.entity.kind === kind && i.severity === 'error'; }) ? 'bad' : 'warn'; }
  S.register({ id: 'scenes', title: 'Scenes', icon: 'play', group: 'Automation', order: 1, render: renderScenes, dispose: leave, onIssues: refreshLive,
    badge: function () { return countIssues('scene'); }, badgeKind: function () { return kindOfBadge('scene'); } });
  S.register({ id: 'programming', title: 'Visual Programming', icon: 'code', group: 'Automation', order: 2, render: renderProgramming, dispose: leave, onIssues: refreshLive,
    badge: function () { return countIssues('rule'); }, badgeKind: function () { return kindOfBadge('rule'); } });
  S.register({ id: 'scheduling', title: 'Scheduling', icon: 'calendar', group: 'Automation', order: 3, render: renderScheduling, dispose: leave, onIssues: refreshLive });
})();
</script>
<script>
/* Installer Studio: Stations (staff device access). A station is a fixed screen,
   known by its LAN address, that opens as its own staff profile instead of the
   default one. Only a profile WITHOUT a PIN can be given to a station: an address
   is not a secret, so it may choose which open profile a screen gets and nothing more. */
(function () {
  'use strict';
  var h = VF.h, icon = VF.icon;
  var selected = null;

  function openProfiles() { return Studio.list('profiles').filter(function (p) { return !p.hasPin; }); }

  function render(container) {
    if (!Studio.hasDraft()) { Studio.emptyDraft(container); return; }
    var stations = Studio.list('stations');
    var profiles = openProfiles();
    var current = VF.byId(stations, selected) || stations[0] || null;
    selected = current ? current.id : null;

    var add = h('button.btn.primary', { type: 'button', disabled: !profiles.length, onclick: function () {
      var id = Studio.freshId('stations', 'Station');
      selected = id;
      Studio.update('Add station', function (c) { c.stations.push({ id: id, name: 'New station', address: '', profileId: profiles[0].id }); });
    } }, icon('plus'), 'Add station');

    var list = h('div.list');
    stations.forEach(function (st) {
      list.appendChild(h('div.item.clickable' + (st.id === selected ? '.sel' : ''), { onclick: function () { selected = st.id; Studio.refresh(); } },
        icon('monitor'),
        h('div.grow', h('div.ellipsis', st.name), h('div.small.muted.ellipsis', (st.address || 'no address yet') + ' opens as ' + Studio.nameOf('profiles', st.profileId))),
        Studio.issueChip('station', st.id)));
    });
    if (!stations.length) list.appendChild(h('div.empty', 'No stations. Every tile opens as the default profile chosen under Staff Profiles.'));

    var editor;
    if (current) {
      var set = function (label, fn) { Studio.update(label, function (c) { var s = VF.byId(c.stations, current.id); if (s) fn(s); }); };
      editor = h('div.panel.pad.col',
        h('div.row.between', h('h2', current.name), h('button.btn.sm.danger', { type: 'button', onclick: function () { Studio.confirmRemove('station', current.id, 'station').then(function (ok) { if (ok) selected = null; }); } }, icon('trash'), 'Delete')),
        Studio.issueList(Studio.issuesFor('station', current.id)),
        h('div.form',
          Studio.text('Name', current.name, function (v) { set('Rename station', function (s) { s.name = v || s.name; }); }, { hint: 'For example "Bartender tablet" or "Host station".' }),
          Studio.text('LAN address', current.address, function (v) { set('Station address', function (s) { s.address = v; }); }, { placeholder: '192.168.1.52', inputmode: 'decimal', max: 15, hint: 'The screen\'s IPv4 address. Reserve it in the router so it does not change.' }),
          Studio.select('Opens as', profiles.map(function (p) { return { value: p.id, label: p.name }; }), current.profileId, function (v) { if (v) set('Station profile', function (s) { s.profileId = v; }); }, { hint: 'Only profiles without a PIN are listed.' })),
        h('div.banner.info', icon('info'), h('div.small',
          h('div', 'A tile opened from this address shows what that profile may see, with no sign-in. Any other tile opens as the default profile.'),
          h('div', 'An address can be imitated on the venue network, so a station can never be given a profile that needs a PIN. Staff with a PIN still sign in on any screen.'))));
    } else {
      editor = h('div.panel.pad', h('p.muted', profiles.length ? 'Add a station to give one screen its own profile.' : 'Every staff profile has a PIN. A station needs a profile without one.'));
    }

    VF.mount(container,
      Studio.sectionHead('Stations', 'Give a fixed screen (a bar tablet, a host stand, a meeting-room panel) its own staff profile by its network address.', [add]),
      h('div.split', h('div.col', list), editor));
  }

  Studio.register({ id: 'stations', title: 'Stations', icon: 'monitor', group: 'Access', order: 2, render: render,
    badge: function () { var n = Studio.list('stations').length; return n || null; } });
})();
</script>
<script>
Studio.start();
</script>
</body>
